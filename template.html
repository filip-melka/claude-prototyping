<!doctype html>
<!--
  Prototype template.

  Copy this file to prototypes/<TASK-ID>/index.html and build the idea inside the
  marked regions. Rules that must survive the copy:
    - self-contained: inline <style> and <script> only, no external URL of any kind
    - phone first: designed for a ~390x844 viewport, thumb-reachable controls
    - the back link stays, so the prototype is never a dead end
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Prototype</title>
<style>
  :root {
    --bg: #f6f6f7;
    --surface: #ffffff;
    --text: #17171a;
    --muted: #6b6b76;
    --border: #e3e3e8;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e11;
      --surface: #17171c;
      --text: #f2f2f5;
      --muted: #9a9aa6;
      --border: #2a2a32;
      --accent: #7c74ff;
      --accent-text: #0e0e11;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }

  /* App shell: fills the viewport, keeps content clear of notch and home bar. */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 16px)
      calc(env(safe-area-inset-left) + 16px);
    max-width: 520px;
    margin: 0 auto;
  }

  .app__header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    line-height: 1;
  }

  .back:active { transform: scale(.94); }

  .app__title {
    margin: 0;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -.01em;
  }

  .app__body {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Generic bits worth keeping: a card and a primary button. */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px;
  }

  .btn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    min-height: 48px;
    padding: 0 20px;
    cursor: pointer;
  }

  .btn:active { transform: scale(.98); }
</style>
</head>
<body>

<div class="app">
  <header class="app__header">
    <a class="back" href="../../index.html" aria-label="Back to gallery">&larr;</a>
    <h1 class="app__title">Prototype</h1>
  </header>

  <main class="app__body">
    <!-- APP MARKUP -->
    <div class="card">Replace me.</div>
    <!-- /APP MARKUP -->
  </main>
</div>

<script>
  // APP LOGIC
  // /APP LOGIC
</script>

</body>
</html>
