<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Conqueror</title>
<style>
  :root {
    --bg: #edf0fa;
    --surface: #ffffff;
    --surface-2: #f4f5fc;
    --text: #171b34;
    --muted: #6e7391;
    --line: #dfe2f2;
    --track: #d9dcee;
    --lock: #a3a9c8;
    --gold: #f5b62a;
    --gold-deep: #d89312;
    --good: #2f9e68;
    --bad: #e63950;
    --shadow: 0 6px 16px rgba(23, 27, 52, .10);
    --era-ancient: #e8623d;
    --era-medieval: #2f9e68;
    --era-empires: #7b4fe0;
    --era-revolution: #e63950;
    --radius: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171b34;
      --surface: #232848;
      --surface-2: #1e2340;
      --text: #f2f3ff;
      --muted: #9ba1c6;
      --line: #303660;
      --track: #303660;
      --lock: #6b7199;
      --shadow: 0 6px 18px rgba(0, 0, 0, .38);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }

  .display {
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 800;
    letter-spacing: -.01em;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 12px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 16px)
      calc(env(safe-area-inset-left) + 16px);
    max-width: 520px;
    margin: 0 auto;
  }

  .app__header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 999px;
    border: 0;
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
    font-size: 17px;
    line-height: 1;
    box-shadow: var(--shadow);
    transition: transform .13s cubic-bezier(.34, 1.56, .64, 1);
  }

  .back:active { transform: scale(.92); }

  .app__title {
    margin: 0;
    font-size: 19px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Talents pill ------------------------------------------------------- */
  .talents {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 38px;
    padding: 0 14px 0 10px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
    font-size: 16px;
    flex: none;
    position: relative;
  }

  .talents__n { font-variant-numeric: tabular-nums; }

  .talents.bump { animation: bump .34s cubic-bezier(.34, 1.56, .64, 1); }

  @keyframes bump {
    40% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .float {
    position: absolute;
    right: 14px;
    top: 34px;
    font-size: 15px;
    font-weight: 800;
    pointer-events: none;
    animation: float-down .9s ease-out forwards;
  }

  .float--up { color: var(--gold-deep); }
  .float--down { color: var(--bad); }

  @media (prefers-color-scheme: dark) {
    .float--up { color: var(--gold); }
  }

  @keyframes float-down {
    0% { opacity: 0; transform: translateY(-8px); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(16px); }
  }

  .coin { width: 22px; height: 22px; display: block; flex: none; }

  .app__body { flex: 1; display: flex; flex-direction: column; }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.is-on { display: flex; animation: fade-in .22s ease-out; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  /* Campaign map ------------------------------------------------------- */
  .map {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding-bottom: 6px;
  }

  .map__hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 10px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .row--right { flex-direction: row-reverse; }
  .row--right .row__info { text-align: right; }

  .row__info { flex: 1; min-width: 0; }

  .row__name { font-size: 17px; margin: 0; }

  .row__years {
    font-size: 12px;
    color: var(--muted);
    margin: 1px 0 8px;
    letter-spacing: .02em;
  }

  .row__status {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .row__status b { color: var(--text); }

  .medallion {
    width: 92px;
    height: 92px;
    flex: none;
    border-radius: 50%;
    border: 0;
    padding: 0;
    display: grid;
    place-items: center;
    position: relative;
    background: var(--era);
    color: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .13s cubic-bezier(.34, 1.56, .64, 1);
  }

  .medallion::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .16);
  }

  .medallion .ico {
    width: 46px;
    height: 46px;
    position: relative;
    z-index: 1;
  }

  .medallion:active { transform: scale(.94); }

  .medallion--locked {
    background: var(--track);
    color: var(--lock);
    box-shadow: none;
  }

  .medallion--locked::before { background: rgba(255, 255, 255, .10); }

  .medallion--pop { animation: pop .5s cubic-bezier(.34, 1.56, .64, 1); }

  @keyframes pop {
    0% { transform: scale(.7); }
    55% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  .shake { animation: shake .4s ease; }

  @keyframes shake {
    10%, 50% { transform: translateX(-7px); }
    30%, 70% { transform: translateX(7px); }
    90% { transform: translateX(-3px); }
    100% { transform: none; }
  }

  .unlock {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform .13s cubic-bezier(.34, 1.56, .64, 1);
  }

  .unlock:active { transform: scale(.95); }
  .unlock .coin { width: 18px; height: 18px; }
  .unlock--afford { background: var(--gold); color: #3a2a00; }

  .link {
    width: 100%;
    height: 74px;
    display: block;
    color: var(--track);
  }

  .link path {
    stroke: currentColor;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 2 16;
    fill: none;
  }

  .link--done { color: var(--good); }

  /* Quiz --------------------------------------------------------------- */
  .quizbar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
  }

  .seg {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }

  .seg--on { background: var(--era); }
  .seg--miss { background: var(--bad); }

  .qcard {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 18px;
    margin-bottom: 16px;
  }

  .qcard__tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--era);
    margin: 0 0 8px;
  }

  .qcard__q {
    margin: 0;
    font-size: 19px;
    line-height: 1.35;
    font-weight: 600;
  }

  .answers { display: flex; flex-direction: column; gap: 10px; }

  .answer {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 10px 14px;
    border: 0;
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    font: inherit;
    font-size: 16px;
    text-align: left;
    line-height: 1.3;
    cursor: pointer;
    transition: transform .13s cubic-bezier(.34, 1.56, .64, 1), background-color .13s linear, color .13s linear;
  }

  .answer:active { transform: scale(.97); }

  .answer__k {
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 800;
    font-size: 14px;
  }

  .answer--good, .answer--bad { color: #fff; }
  .answer--good { background: var(--good); }
  .answer--bad { background: var(--bad); }

  .answer--good .answer__k, .answer--bad .answer__k {
    background: rgba(255, 255, 255, .24);
    color: #fff;
  }

  .answer--out { opacity: .38; }
  .answer--dim { opacity: .55; }
  .answer[disabled] { cursor: default; }

  .answer__mark {
    margin-left: auto;
    width: 22px;
    height: 22px;
    flex: none;
  }

  .quizfoot { margin-top: auto; padding-top: 16px; }

  .btn {
    appearance: none;
    border: 0;
    border-radius: var(--radius);
    background: var(--era, #7b4fe0);
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 17px;
    width: 100%;
    min-height: 56px;
    padding: 0 20px;
    cursor: pointer;
    transition: transform .13s cubic-bezier(.34, 1.56, .64, 1);
  }

  .btn:active { transform: scale(.97); }

  .btn--ghost {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 700;
    font-size: 16px;
  }

  .btn--ghost[disabled] { opacity: .45; cursor: default; }
  .btn--ghost .coin { width: 18px; height: 18px; }

  /* Results ------------------------------------------------------------ */
  .results {
    align-items: center;
    text-align: center;
    padding-top: 6px;
  }

  .badge {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: var(--era);
    color: #fff;
    display: grid;
    place-items: center;
    position: relative;
    margin: 4px 0 14px;
    box-shadow: var(--shadow);
    animation: pop .5s cubic-bezier(.34, 1.56, .64, 1);
  }

  .badge::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .16);
  }

  .badge__n {
    position: relative;
    z-index: 1;
    font-size: 44px;
    line-height: 1;
  }

  .results__head { margin: 0 0 4px; font-size: 22px; }
  .results__sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }

  .tally {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 4px 16px;
    margin-bottom: 14px;
  }

  .tally__row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    font-size: 15px;
  }

  .tally__row + .tally__row { border-top: 1px solid var(--line); }
  .tally__row span:first-child { text-align: left; flex: 1; }

  .tally__v { font-weight: 800; font-variant-numeric: tabular-nums; }
  .tally__v--gold { color: var(--gold-deep); }

  @media (prefers-color-scheme: dark) { .tally__v--gold { color: var(--gold); } }

  .tally__row--total { font-weight: 700; }

  .banner {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--gold);
    color: #3a2a00;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 14px;
    animation: pop .5s cubic-bezier(.34, 1.56, .64, 1);
  }

  .banner__ico { width: 26px; height: 26px; flex: none; }

  .results__foot { margin-top: auto; width: 100%; padding-top: 12px; }

  /* Toast -------------------------------------------------------------- */
  .toast {
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top) + 62px);
    transform: translate(-50%, -12px);
    max-width: 300px;
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--text);
    color: var(--bg);
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 20;
  }

  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app__header">
    <a class="back" href="../../index.html" aria-label="Back to gallery">&larr;</a>
    <h1 class="app__title display" id="title">Conqueror</h1>
    <div class="talents" id="talents" aria-label="Talents">
      <svg class="coin" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#f5b62a"></circle>
        <circle cx="12" cy="12" r="6.4" fill="none" stroke="#d89312" stroke-width="2"></circle>
        <path d="M8.4 5.6A7.4 7.4 0 0 0 5.6 8.4" fill="none" stroke="#ffe08a" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <span class="talents__n display" id="talents-n">0</span>
    </div>
  </header>

  <main class="app__body">
    <!-- APP MARKUP -->
    <section class="screen is-on" id="screen-map">
      <p class="map__hint">Answer trivia, earn Talents, buy your way through history.</p>
      <div class="map" id="map"></div>
    </section>

    <section class="screen" id="screen-quiz">
      <div class="quizbar" id="quizbar"></div>
      <div class="qcard">
        <p class="qcard__tag" id="q-tag">Question 1 of 5</p>
        <p class="qcard__q" id="q-text"></p>
      </div>
      <div class="answers" id="answers"></div>
      <div class="quizfoot" id="quizfoot"></div>
    </section>

    <section class="screen results" id="screen-results">
      <div class="badge" id="r-badge"><span class="badge__n display" id="r-pct">0%</span></div>
      <h2 class="results__head display" id="r-head">Campaign report</h2>
      <p class="results__sub" id="r-sub">Ancient World</p>
      <div class="tally" id="r-tally"></div>
      <div id="r-banner"></div>
      <div class="results__foot">
        <button class="btn" id="r-again" style="margin-bottom:10px">Replay for more Talents</button>
        <button class="btn btn--ghost" id="r-map">Return to Map</button>
      </div>
    </section>
    <!-- /APP MARKUP -->
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  // APP LOGIC
  var PER_CORRECT = 10;      // Talents for each right answer
  var FLAWLESS = 25;         // bonus for a 5/5 run
  var HINT_COST = 25;        // "Ask Advisor"
  var KEY = 'conqueror.v1';

  var ICONS = {
    temple: '<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M7 17L24 7l17 10"></path>'

    + '<rect x="11" y="21" width="26" height="19" rx="6"></rect>'
    + '<path d="M17 21v-5a7 7 0 0 1 13.6-2.4"></path></svg>';

  var TICK = '<svg class="answer__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"></path></svg>';
  var CROSS = '<svg class="answer__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>';

  var ERAS = [
    {
      id: 'ancient', name: 'Ancient World', years: '3000 BCE – 500 CE',
      color: '#e8623d', cost: 0, icon: 'temple',
      questions: [
        { q: 'Which conqueror had built an empire stretching from Greece to India by his death in 323 BCE?', a: ['Alexander the Great', 'Julius Caesar', 'Cyrus the Great', 'Xerxes I'], c: 0 },

        { q: 'As a young man, Alexander the Great was tutored by which philosopher?', a: ['Aristotle', 'Plato', 'Socrates', 'Pythagoras'], c: 0 }

    {

      questions: [
        { q: 'Genghis Khan founded which empire, which became the largest contiguous land empire in history?', a: ['Ottoman Empire', 'Golden Horde', 'Mongol Empire', 'Yuan Dynasty'], c: 2 },

        { q: 'Saladin famously recaptured which city from Crusader forces in 1187?', a: ['Damascus', 'Antioch', 'Jerusalem', 'Constantinople'], c: 2 },

    {

      color: '#7b4fe0', cost: 250, icon: 'wheel',
      questions: [
        { q: 'Hernán Cortés led the Spanish conquest of which empire in the 1520s?', a: ['Inca Empire', 'Aztec Empire', 'Maya civilization', 'Zapotec civilization'], c: 1 },
        { q: 'Francisco Pizarro led the Spanish conquest of which South American empire?', a: ['Inca Empire', 'Aztec Empire', 'Muisca Confederation', 'Chimor Kingdom'], c: 0 },
        { q: "Robert Clive's victory at which 1757 battle helped establish British control in Bengal?", a: ['Battle of Panipat', 'Battle of Buxar', 'Battle of Plassey', 'Siege of Arcot'], c: 2 },
        { q: 'The Mughal Empire in India was founded by Babur, a descendant of which two conquerors?', a: ['Alexander and Cyrus', 'Attila and Saladin', 'Genghis Khan and Timur', 'Saladin and Timur'], c: 2 },
        { q: 'Suleiman, who expanded the Ottoman Empire to its greatest extent, is remembered in the West by which epithet?', a: ['The Magnificent', 'The Conqueror', 'The Great', 'The Terrible'], c: 0 }
      ]
    },
    {
      id: 'revolution', name: 'Age of Revolution', years: '1789 – 1900 CE',
      color: '#e63950', cost: 500, icon: 'cannon',
      questions: [
        { q: 'Napoleon Bonaparte crowned himself Emperor of the French in which year?', a: ['1799', '1804', '1812', '1815'], c: 1 },
        { q: "Napoleon's disastrous 1812 campaign was launched against which country?", a: ['Russia', 'Prussia', 'Austria', 'Spain'], c: 0 },
        { q: 'Napoleon suffered his final defeat at which 1815 battle?', a: ['Austerlitz', 'Trafalgar', 'Leipzig', 'Waterloo'], c: 3 },
        { q: 'Which Zulu king built a powerful centralized military kingdom in southern Africa in the early 1800s?', a: ['Cetshwayo', 'Shaka Zulu', 'Dingane', 'Moshoeshoe'], c: 1 },
        { q: 'Which Sikh leader unified Punjab into a powerful empire in the early 19th century?', a: ['Hari Singh Nalwa', 'Guru Gobind Singh', 'Ranjit Singh', 'Dalip Singh'], c: 2 }
      ]
    }
  ];

  var LETTERS = ['A', 'B', 'C', 'D'];

  var state = loadState();
  var run = null;
  var popEra = null;

  var el = {
    title: document.getElementById('title'),
    talents: document.getElementById('talents'),
    talentsN: document.getElementById('talents-n'),
    map: document.getElementById('map'),
    toast: document.getElementById('toast'),
    quizbar: document.getElementById('quizbar'),
    qTag: document.getElementById('q-tag'),
    qText: document.getElementById('q-text'),
    answers: document.getElementById('answers'),
    quizfoot: document.getElementById('quizfoot'),
    rBadge: document.getElementById('r-badge'),
    rPct: document.getElementById('r-pct'),
    rHead: document.getElementById('r-head'),
    rSub: document.getElementById('r-sub'),
    rTally: document.getElementById('r-tally'),
    rBanner: document.getElementById('r-banner'),
    rAgain: document.getElementById('r-again'),
    rMap: document.getElementById('r-map')
  };

  function loadState() {
    var fresh = { talents: 50, unlocked: ['ancient'], best: {} };
    try {
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && typeof raw.talents === 'number' && raw.unlocked && raw.unlocked.length) {
        return { talents: raw.talents, unlocked: raw.unlocked, best: raw.best || {} };
      }
    } catch (e) {}
    return fresh;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function unlocked(era) { return state.unlocked.indexOf(era.id) > -1; }

  function drawTalents(delta) {
    el.talentsN.textContent = state.talents;
    if (delta) {
      el.talents.classList.remove('bump');
      void el.talents.offsetWidth;
      el.talents.classList.add('bump');
      var f = document.createElement('span');
      f.className = 'float display ' + (delta > 0 ? 'float--up' : 'float--down');
      f.textContent = (delta > 0 ? '+' : '') + delta;
      el.talents.appendChild(f);
      setTimeout(function () { f.remove(); }, 900);
    }
  }

  var toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('is-on'); }, 2000);
  }

  function show(name) {
    ['map', 'quiz', 'results'].forEach(function (s) {
      document.getElementById('screen-' + s).classList.toggle('is-on', s === name);
    });
    window.scrollTo(0, 0);
  }

  /* ---- Campaign map -------------------------------------------------- */
  function drawMap() {
    el.map.innerHTML = '';
    for (var i = ERAS.length - 1; i >= 0; i--) {
      el.map.appendChild(mapRow(ERAS[i], i));
      if (i > 0) el.map.appendChild(linkSvg(i));
    }
    if (popEra) {
      var node = el.map.querySelector('[data-pop="' + popEra + '"]');
      if (node) node.classList.add('medallion--pop');
      popEra = null;
    }
  }

  function mapRow(era, i) {
    var open = unlocked(era);
    var row = document.createElement('div');
    row.className = 'row' + (i % 2 ? ' row--right' : '');

    var btn = document.createElement('button');
    btn.className = 'medallion' + (open ? '' : ' medallion--locked');
    btn.style.setProperty('--era', era.color);
    btn.dataset.pop = era.id;
    btn.innerHTML = open ? ICONS[era.icon] : ICONS.lock;
    btn.setAttribute('aria-label', open ? 'Play ' + era.name : era.name + ' locked, costs ' + era.cost + ' Talents');
    btn.addEventListener('click', function () {
      if (open) startRun(i); else tryUnlock(era, btn);
    });

    var info = document.createElement('div');
    info.className = 'row__info';
    var best = state.best[era.id];
    var status;
    if (open) {
      status = '<p class="row__status">' + (best == null ? 'Not started' : 'Best: <b>' + best + '%</b>') + '</p>';
    } else {
      var afford = state.talents >= era.cost;
      status = '<button class="unlock' + (afford ? ' unlock--afford' : '') + '" type="button">Unlock &mdash; ' + era.cost + ' ' + COIN + '</button>';
    }
    info.innerHTML = '<p class="row__name display">' + era.name + '</p>'
      + '<p class="row__years">' + era.years + '</p>' + status;

    if (!open) {
      info.querySelector('.unlock').addEventListener('click', function () { tryUnlock(era, btn); });
    }

    row.appendChild(btn);
    row.appendChild(info);
    return row;
  }

  function linkSvg(upperIndex) {
    // Dotted path between two staggered nodes. Even-indexed eras sit on the left,
    // so the bottom end of this gap (era upperIndex - 1) is on the left when
    // upperIndex is odd. 46 / 314 line the dots up with the medallion centres.
    var bottomLeft = (upperIndex % 2) === 1;
    var x1 = bottomLeft ? 46 : 314;
    var x2 = bottomLeft ? 314 : 46;
    var wrap = document.createElement('div');
    var done = unlocked(ERAS[upperIndex]);
    wrap.innerHTML = '<svg class="link' + (done ? ' link--done' : '') + '" viewBox="0 0 360 74" preserveAspectRatio="none" aria-hidden="true">'
      + '<path d="M' + x1 + ' 74 C' + x1 + ' 40, ' + x2 + ' 34, ' + x2 + ' 0"></path></svg>';
    return wrap.firstChild;
  }

  function tryUnlock(era, node) {
    if (state.talents >= era.cost) {
      state.talents -= era.cost;
      state.unlocked.push(era.id);
      save();
      drawTalents(-era.cost);
      popEra = era.id;
      drawMap();
      toast(era.name + ' unlocked!');
    } else {
      node.classList.remove('shake');
      void node.offsetWidth;
      node.classList.add('shake');
      toast('Need ' + (era.cost - state.talents) + ' more Talents');
    }
  }

  /* ---- Quiz ---------------------------------------------------------- */
  function startRun(eraIndex) {
    var era = ERAS[eraIndex];
    run = { era: era, eraIndex: eraIndex, i: 0, correct: 0, earned: 0, marks: [], answered: false, hinted: false };
    el.title.textContent = era.name;
    document.getElementById('screen-quiz').style.setProperty('--era', era.color);
    show('quiz');
    drawQuestion();
  }

  function drawQuestion() {
    var q = run.era.questions[run.i];
    run.answered = false;
    run.hinted = false;

    el.quizbar.innerHTML = '';
    for (var s = 0; s < run.era.questions.length; s++) {
      var seg = document.createElement('div');
      var mark = run.marks[s];
      seg.className = 'seg' + (mark === true ? ' seg--on' : mark === false ? ' seg--miss' : '');
      el.quizbar.appendChild(seg);
    }

    el.qTag.textContent = 'Question ' + (run.i + 1) + ' of ' + run.era.questions.length;
    el.qText.textContent = q.q;

    el.answers.innerHTML = '';
    q.a.forEach(function (text, idx) {
      var b = document.createElement('button');
      b.className = 'answer';
      b.type = 'button';
      b.innerHTML = '<span class="answer__k">' + LETTERS[idx] + '</span><span>' + text + '</span>';
      b.addEventListener('click', function () { answer(idx); });
      el.answers.appendChild(b);
    });

    drawFoot();
  }

  function drawFoot() {
    el.quizfoot.innerHTML = '';
    if (run.answered) {
      var next = document.createElement('button');
      next.className = 'btn';
      next.type = 'button';
      var last = run.i === run.era.questions.length - 1;
      next.textContent = last ? 'See Results' : 'Next Question';
      next.addEventListener('click', function () {
        if (last) finishRun(); else { run.i++; drawQuestion(); }
      });
      el.quizfoot.appendChild(next);
    } else {
      var hint = document.createElement('button');
      hint.className = 'btn btn--ghost';
      hint.type = 'button';
      hint.innerHTML = 'Ask Advisor &mdash; ' + HINT_COST + ' ' + COIN;
      hint.disabled = run.hinted || state.talents < HINT_COST;
      hint.addEventListener('click', askAdvisor);
      el.quizfoot.appendChild(hint);
    }
  }

  function askAdvisor() {
    if (run.hinted || run.answered || state.talents < HINT_COST) return;
    var q = run.era.questions[run.i];
    var buttons = el.answers.querySelectorAll('.answer');
    var wrong = [];
    for (var i = 0; i < buttons.length; i++) {
      if (i !== q.c && !buttons[i].classList.contains('answer--out')) wrong.push(i);
    }
    if (!wrong.length) return;
    var pick = wrong[Math.floor(Math.random() * wrong.length)];
    buttons[pick].classList.add('answer--out');
    buttons[pick].disabled = true;
    run.hinted = true;
    state.talents -= HINT_COST;
    save();
    drawTalents(-HINT_COST);
    toast('The advisor rules out ' + LETTERS[pick]);
    drawFoot();
  }

  function answer(idx) {
    if (run.answered) return;
    run.answered = true;
    var q = run.era.questions[run.i];
    var right = idx === q.c;
    var buttons = el.answers.querySelectorAll('.answer');

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      buttons[i].classList.remove('answer--out');
      if (i === q.c) {
        buttons[i].classList.add('answer--good');
        buttons[i].insertAdjacentHTML('beforeend', TICK);
      } else if (i === idx) {
        buttons[i].classList.add('answer--bad');
        buttons[i].insertAdjacentHTML('beforeend', CROSS);
      } else {
        buttons[i].classList.add('answer--dim');
      }
    }

    run.marks[run.i] = right;
    el.quizbar.children[run.i].className = 'seg ' + (right ? 'seg--on' : 'seg--miss');

    if (right) {
      run.correct++;
      run.earned += PER_CORRECT;
      state.talents += PER_CORRECT;
      save();
      drawTalents(PER_CORRECT);
    }
    drawFoot();
  }

  /* ---- Results ------------------------------------------------------- */
  function finishRun() {
    var total = run.era.questions.length;
    var pct = Math.round(run.correct / total * 100);
    var flawless = run.correct === total;
    var bonus = 0;

    if (flawless) {
      bonus = FLAWLESS;
      run.earned += bonus;
      state.talents += bonus;
    }
    if (state.best[run.era.id] == null || pct > state.best[run.era.id]) state.best[run.era.id] = pct;
    save();
    drawTalents(bonus || null);

    el.title.textContent = 'Results';
    document.getElementById('screen-results').style.setProperty('--era', run.era.color);
    el.rPct.textContent = pct + '%';
    el.rHead.textContent = flawless ? 'Flawless campaign!' : pct >= 60 ? 'Ground gained' : 'The advance stalls';
    el.rSub.textContent = run.era.name;

    var rows = '<div class="tally__row"><span>Correct</span><span class="tally__v">' + run.correct + ' / ' + total + '</span></div>'
      + '<div class="tally__row"><span>' + run.correct + ' &times; ' + PER_CORRECT + ' Talents</span><span class="tally__v tally__v--gold">+' + (run.correct * PER_CORRECT) + '</span></div>';
    if (flawless) {
      rows += '<div class="tally__row"><span>Flawless bonus</span><span class="tally__v tally__v--gold">+' + bonus + '</span></div>';
    }
    rows += '<div class="tally__row tally__row--total"><span>Talents earned</span><span class="tally__v tally__v--gold">+' + run.earned + '</span></div>';
    el.rTally.innerHTML = rows;

    var next = ERAS[run.eraIndex + 1];
    if (next && !unlocked(next) && state.talents >= next.cost) {
      el.rBanner.innerHTML = '<div class="banner">' + OPEN_LOCK + '<span>You can now unlock ' + next.name + ' &mdash; ' + next.cost + ' Talents</span></div>';
    } else if (next && !unlocked(next)) {
      el.rBanner.innerHTML = '<div class="tally"><div class="tally__row"><span>' + next.name + ' costs</span><span class="tally__v">' + next.cost + ' &mdash; ' + (next.cost - state.talents) + ' to go</span></div></div>';
    } else {
      el.rBanner.innerHTML = '';
    }

    el.rBadge.classList.remove('badge');
    void el.rBadge.offsetWidth;
    el.rBadge.classList.add('badge');

    show('results');
  }

  el.rAgain.addEventListener('click', function () { startRun(run.eraIndex); });
  el.rMap.addEventListener('click', function () {
    el.title.textContent = 'Conqueror';
    drawMap();
    show('map');
    scrollMapToStart();
  });

  function scrollMapToStart() {
    // The path runs bottom to top, so the earliest era sits at the bottom.
    window.scrollTo(0, document.body.scrollHeight);
  }

  drawTalents();
  drawMap();
  scrollMapToStart();
  // /APP LOGIC
</script>

</body>
</html>
