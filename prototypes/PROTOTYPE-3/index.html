<!doctype html>
<!--
  PROTOTYPE-3 — Koch Code
  Morse trainer on the Koch method: full-speed characters, wide Farnsworth gaps,
  a new character unlocks at 90% accuracy. Two answer modes to compare: Type vs Tap.
  Self-contained: tones are synthesised with the Web Audio API, progress lives in
  localStorage. No network, no build step.

  v2 layout is modelled on real lesson/quiz screens: a segmented per-question
  progress bar and a replay control above a hairline-divided answer zone (the
  Duolingo lesson pattern), and a donut accuracy ring with a correct/missed
  legend on the results screen (the Quizlet test-results pattern).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Koch Code</title>
<style>
  /* Dark is the intended look; light is a paper-terminal translation of it. */
  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --surface-2: #e2e7e2;
    --text: #101512;
    --muted: #61706a;
    --border: #d2dad4;
    --accent: #067a42;
    --accent-dim: rgba(6, 122, 66, .14);
    --accent-text: #ffffff;
    --bad: #c4392c;
    --bad-dim: rgba(196, 57, 44, .14);
    --amber: #9a6400;
    --amber-dim: rgba(154, 100, 0, .12);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1210;
      --surface: #141b18;
      --surface-2: #1c2521;
      --text: #e8f0ea;
      --muted: #7d8f86;
      --border: #24302b;
      --accent: #39ff88;
      --accent-dim: rgba(57, 255, 136, .13);
      --accent-text: #06110b;
      --bad: #ff5c4d;
      --bad-dim: rgba(255, 92, 77, .15);
      --amber: #ffc24d;
      --amber-dim: rgba(255, 194, 77, .13);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }

  /* App shell: full-bleed, no nav chrome beyond the gallery back link. */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 10px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 16px);
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ---------- top bar ---------- */

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    height: 36px;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    appearance: none;
    font-family: inherit;
  }
  .icon-btn:active { transform: scale(.94); }

  .bar__title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .counter {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .counter b { color: var(--accent); font-weight: 600; }

  /* Segmented run progress — one segment per character, coloured by outcome.
     Borrowed from lesson progress bars, but it doubles as a live scoreline. */
  .segs {
    display: flex;
    gap: 3px;
    flex: none;
    margin: 12px 0 2px;
    height: 6px;
  }

  .seg {
    flex: 1;
    border-radius: 3px;
    background: var(--surface-2);
    transition: background-color .18s ease, transform .18s ease;
  }
  .seg.is-good { background: var(--accent); }
  .seg.is-bad { background: var(--bad); }
  .seg.is-now { background: var(--muted); transform: scaleY(1.9); }

  .app__body {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .screen.is-active { display: flex; }

  /* ---------- shared bits ---------- */

  .btn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    min-height: 54px;
    padding: 0 20px;
    width: 100%;
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); }

  .btn--ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Donut ring — conic-gradient, so no images and no library. */
  .ring {
    position: relative;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--p, 0) * 1%), var(--surface-2) 0);
  }
  .ring::after {
    content: '';
    position: absolute;
    inset: 11px;
    border-radius: 50%;
    background: var(--bg);
  }
  .ring__in {
    position: relative;
    z-index: 1;
    text-align: center;
    line-height: 1;
  }

  /* ---------- home ---------- */

  .home__top {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    gap: 18px;
  }

  .dial { width: 176px; height: 176px; }
  .dial .ring__in .n {
    font-family: var(--mono);
    font-size: 60px;
    font-weight: 600;
    letter-spacing: -.04em;
    color: var(--accent);
    display: block;
  }
  .dial .ring__in .of {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--muted);
    display: block;
    margin-top: 8px;
  }

  .hero__label {
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -8px;
  }

  .known {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    max-width: 320px;
  }

  .known__chip {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 6px 11px;
    border-radius: 9px;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .known__chip--next {
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
  }

  /* Two small stat cards, side by side. */
  .stats { display: flex; gap: 10px; width: 100%; max-width: 320px; }

  .stat {
    flex: 1;
    padding: 11px 13px;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .stat__k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .stat__v { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); margin-top: 3px; }
  .stat__v em { font-style: normal; color: var(--accent); }

  .home__bottom { flex: none; display: flex; flex-direction: column; gap: 12px; }

  .toggle {
    display: flex;
    padding: 4px;
    gap: 4px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .toggle__btn {
    appearance: none;
    flex: 1;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background-color .16s ease, color .16s ease;
  }
  .toggle__btn.is-on { background: var(--accent); color: var(--accent-text); }
  .toggle__btn:active { transform: scale(.985); }

  .toggle__hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin: -4px 0 0;
  }

  /* ---------- session ---------- */

  /* Stage: waveform while a tone plays, swapped for the answer glyph on feedback. */
  .stage {
    flex: 1;
    min-height: 132px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 62px;
  }

  .wave__bar {
    width: 6px;
    height: 3px;
    border-radius: 3px;
    background: var(--accent);
    opacity: .5;
    transition: height .05s linear, opacity .05s linear;
  }

  .replay {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
  }
  .replay:active { transform: scale(.95); }
  .replay:disabled { opacity: .35; }

  /* The answered character, echoed at hero size in place of the waveform. */
  .echo { display: none; text-align: center; }
  .echo.is-on { display: block; }
  .echo__ch {
    font-family: var(--mono);
    font-size: 76px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.03em;
    animation: pop .16s ease;
  }
  .echo.is-good .echo__ch { color: var(--accent); }
  .echo.is-bad .echo__ch { color: var(--bad); }
  .echo__was {
    display: block;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 12px;
  }

  @keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Hairline split between the stage and the answer zone — the lesson-screen
     pattern that keeps the prompt glued to the controls. */
  .split {
    flex: none;
    border-top: 1px solid var(--border);
    margin: 0 -16px;
  }

  .session__prompt {
    flex: none;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 16px 0 14px;
    min-height: 20px;
  }
  .session__prompt.is-good { color: var(--accent); }
  .session__prompt.is-bad { color: var(--bad); }

  .input {
    appearance: none;
    width: 100%;
    min-height: 60px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .3em;
    text-align: center;
    text-transform: uppercase;
    user-select: text;
    outline: none;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .key {
    appearance: none;
    min-height: 56px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, background-color .1s ease;
  }
  .key:active { transform: scale(.94); background: var(--surface-2); }
  .key.is-good { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .key.is-bad { background: var(--bad); border-color: var(--bad); color: #fff; }

  .session__foot { flex: none; }

  /* full-bleed right/wrong flash */
  .flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: var(--accent);
    transition: opacity .22s ease;
    z-index: 5;
  }
  .flash.is-good { opacity: .12; }
  .flash.is-bad { background: var(--bad); opacity: .14; }

  /* Shown only if the browser refuses to start an AudioContext at all. */
  .audio-warn {
    display: none;
    flex: none;
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    background: var(--amber-dim);
    color: var(--amber);
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .04em;
    text-align: center;
  }
  .audio-warn.is-on { display: block; }

  /* ---------- results ---------- */

  .results__scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .results__head {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 0 4px;
  }

  .score { width: 116px; height: 116px; }
  .score .ring__in .n {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--text);
  }

  .verdict { flex: 1; min-width: 0; }
  .verdict__h {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.2;
    margin: 0 0 12px;
  }

  /* Correct / missed legend beside the ring. */
  .legend { display: flex; flex-direction: column; gap: 7px; }
  .legend__row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .legend__dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .legend__dot--good { background: var(--accent); }
  .legend__dot--bad { background: var(--bad); }
  .legend__n {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    min-width: 34px;
    text-align: center;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text);
  }

  .unlock {
    display: none;
    margin: 16px 0 0;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--amber-dim);
    border: 1px solid var(--amber);
    color: var(--amber);
    text-align: center;
  }
  .unlock.is-on { display: block; }
  .unlock__k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  .unlock__v { font-family: var(--mono); font-size: 34px; font-weight: 600; line-height: 1.1; margin-top: 4px; }

  .breakdown__head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 24px 0 10px;
  }

  .breakdown { display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }

  .row { display: flex; align-items: center; gap: 11px; }

  .row__char {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--text);
    display: grid;
    place-items: center;
  }
  .row.is-weak .row__char { background: var(--bad-dim); color: var(--bad); }

  .row__bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
  }

  .row__fill { height: 100%; background: var(--accent); }
  .row__fill--bad { background: var(--bad); }

  .row__num {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    width: 46px;
    flex: none;
    text-align: right;
    letter-spacing: .02em;
  }

  .results__foot {
    flex: none;
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    margin: 0 -16px;
    padding-left: 16px;
    padding-right: 16px;
  }
  .results__foot .btn { flex: 1; }
</style>
</head>
<body>

<div class="app">
  <div class="flash" id="flash"></div>

  <!-- top bar: back/close on the left, run counter on the right -->
  <header class="bar">
    <a class="icon-btn" id="backLink" href="../../index.html" aria-label="Back to gallery">&larr;</a>
    <button class="icon-btn" id="quitBtn" type="button" aria-label="End session" style="display:none">&times;</button>
    <span class="bar__title" id="barTitle">Koch Code</span>
    <span class="counter" id="counter"></span>
  </header>

  <div class="segs" id="segs" style="display:none"></div>

  <main class="app__body">
    <!-- APP MARKUP -->

    <!-- HOME -->
    <section class="screen is-active" id="screen-home">
      <div class="home__top">
        <div class="ring dial" id="poolRing">
          <div class="ring__in">
            <span class="n" id="knownCount">2</span>
            <span class="of" id="poolOf">of 16</span>
          </div>
        </div>
        <div class="hero__label" id="knownLabel">characters known</div>

        <div class="known" id="knownSet"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat__k">Best</div>
            <div class="stat__v" id="bestStat"><em>0%</em></div>
          </div>
          <div class="stat">
            <div class="stat__k">Next up</div>
            <div class="stat__v" id="nextStat">R</div>
          </div>
        </div>
      </div>

      <div class="home__bottom">
        <div class="toggle" role="group" aria-label="Input mode">
          <button class="toggle__btn is-on" id="modeType" type="button">Type</button>
          <button class="toggle__btn" id="modeTap" type="button">Tap</button>
        </div>
        <p class="toggle__hint" id="modeHint">Answer on the keyboard</p>
        <button class="btn" id="startBtn" type="button">Start session</button>
        <div class="audio-warn" id="audioWarn">Sound is blocked in this browser — tones won't play</div>
      </div>
    </section>

    <!-- SESSION -->
    <section class="screen" id="screen-session">
      <div class="stage">
        <div class="wave" id="wave"></div>
        <div class="echo" id="echo">
          <span class="echo__ch" id="echoCh"></span>
          <span class="echo__was" id="echoWas"></span>
        </div>
        <button class="replay" id="replayBtn" type="button">&#9654;&#65038; Replay</button>
      </div>

      <div class="split"></div>
      <div class="session__prompt" id="prompt">Listen</div>

      <div class="session__foot">
        <input class="input" id="typeInput" type="text" inputmode="text" maxlength="1"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               aria-label="Type the character you heard">
        <div class="grid" id="tapGrid"></div>
      </div>
    </section>

    <!-- RESULTS -->
    <section class="screen" id="screen-results">
      <div class="results__scroll">
        <div class="results__head">
          <div class="ring score" id="scoreRing">
            <div class="ring__in"><span class="n" id="scoreHero">0%</span></div>
          </div>
          <div class="verdict">
            <h1 class="verdict__h" id="verdictLine">Session complete</h1>
            <div class="legend">
              <div class="legend__row">
                <span class="legend__dot legend__dot--good"></span> Correct
                <span class="legend__n" id="hitCount">0</span>
              </div>
              <div class="legend__row">
                <span class="legend__dot legend__dot--bad"></span> Missed
                <span class="legend__n" id="missCount">0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="unlock" id="unlockBanner">
          <div class="unlock__k">New character unlocked</div>
          <div class="unlock__v" id="unlockChar">J</div>
        </div>

        <div class="breakdown__head">
          <span class="eyebrow">Per character</span>
          <span class="eyebrow" id="passNote">90% to unlock</span>
        </div>
        <div class="breakdown" id="breakdown"></div>
      </div>

      <div class="results__foot">
        <button class="btn btn--ghost" id="homeBtn" type="button">Home</button>
        <button class="btn" id="againBtn" type="button">Again</button>
      </div>
    </section>

    <!-- /APP MARKUP -->
  </main>
</div>

<script>
  // APP LOGIC

  /* ---------- data ---------- */

  // Koch order, trimmed to a 16-character pool — enough to show progression
  // without a tap grid that stops being thumb-sized.
  var POOL = ['K','M','R','S','U','A','P','T','L','O','W','I','N','J','E','F'];

  var MORSE = {
    K: '-.-', M: '--', R: '.-.', S: '...', U: '..-', A: '.-', P: '.--.', T: '-',
    L: '.-..', O: '---', W: '.--', I: '..', N: '-.', J: '.---', E: '.', F: '..-.'
  };

  var SESSION_LEN = 20;
  var PASS = 0.9;
  var STORE = 'koch-code-v1';

  // 20 wpm character speed: one dit is 1200/20 ms. Farnsworth gap is the long
  // pause between characters, which is what actually makes Koch learnable.
  var DIT = 0.06;
  var GAP_AFTER_ANSWER = 620;
  var TONE_HZ = 620;
  var LEAD = 0.12;          // scheduling lead — never queue a tone in the past

  /* ---------- state ---------- */

  var state = {
    known: ['K', 'M'],
    best: 0,
    mode: 'type'   // 'type' | 'tap'
  };

  var session = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (Array.isArray(s.known) && s.known.length) {
        var clean = s.known.filter(function (c) { return POOL.indexOf(c) !== -1; });
        if (clean.length) state.known = clean;
      }
      if (typeof s.best === 'number') state.best = s.best;
      if (s.mode === 'type' || s.mode === 'tap') state.mode = s.mode;
    } catch (e) { /* first run, or storage blocked — defaults are fine */ }
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- elements ---------- */

  var el = {};
  ['screen-home','screen-session','screen-results','knownCount','poolOf','poolRing','knownLabel',
   'knownSet','bestStat','nextStat','modeType','modeTap','modeHint','startBtn','audioWarn',
   'wave','prompt','echo','echoCh','echoWas','replayBtn','typeInput','tapGrid','counter','segs',
   'flash','backLink','quitBtn','barTitle','scoreRing','scoreHero','verdictLine','hitCount',
   'missCount','unlockBanner','unlockChar','passNote','breakdown','homeBtn','againBtn']
  .forEach(function (id) { el[id] = document.getElementById(id); });

  function show(name) {
    ['home', 'session', 'results'].forEach(function (n) {
      el['screen-' + n].classList.toggle('is-active', n === name);
    });
    var inSession = name === 'session';
    el.segs.style.display = inSession ? 'flex' : 'none';
    el.quitBtn.style.display = inSession ? '' : 'none';
    el.backLink.style.display = inSession ? 'none' : '';
    el.counter.style.visibility = inSession ? 'visible' : 'hidden';
    el.barTitle.textContent = inSession ? 'Session' : (name === 'results' ? 'Results' : 'Koch Code');
  }

  /* ---------- audio ----------

     v1 shipped silent. The context was created on the Start tap but `resume()`
     was never awaited, so on Safari the first character was scheduled against a
     context still in `suspended` — where `currentTime` is frozen. By the time
     the context actually started, every event in that envelope (and the
     matching `osc.stop`) was already in the past, so the tone was dropped
     outright rather than played late. Nothing ever sounded.

     The fix has three parts: start a real (silent) node inside the gesture so
     Safari genuinely unlocks, await `resume()` before the run's first tone, and
     re-check `state === 'running'` before every character, scheduling with a
     lead so nothing can land in the past. */

  var ctx = null;
  var master = null;
  var playing = null;   // { osc, gain, segments, endsAt }

  function ensureAudio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
    }
    return ctx;
  }

  // Must be called synchronously from a user gesture. Resolves once the context
  // is actually running (or we know it never will be).
  function unlockAudio() {
    var c = ensureAudio();
    if (!c) return Promise.resolve(false);

    // Safari only really unlocks once a node has been started during a gesture.
    try {
      var src = c.createBufferSource();
      src.buffer = c.createBuffer(1, 1, c.sampleRate);
      src.connect(master);
      src.start(0);
    } catch (e) {}

    var p;
    try { p = (c.state === 'running') ? Promise.resolve() : c.resume(); }
    catch (e) { p = Promise.resolve(); }

    return Promise.resolve(p).then(
      function () { return c.state === 'running'; },
      function () { return false; }
    );
  }

  // Schedules one character as a gain envelope on a single oscillator, and
  // records when it is actually sounding so the waveform can follow it.
  function playChar(ch) {
    stopTone();
    var c = ensureAudio();
    if (!c) return;

    // A context can fall back to 'suspended' (backgrounded tab, iOS call, …).
    if (c.state !== 'running') {
      try { c.resume(); } catch (e) {}
    }

    var code = MORSE[ch] || '.';
    var gain = c.createGain();
    var osc = c.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = TONE_HZ;
    osc.connect(gain);
    gain.connect(master);

    var start = c.currentTime;
    var t = start + LEAD;
    gain.gain.setValueAtTime(0.0001, start);

    var segments = [];
    for (var i = 0; i < code.length; i++) {
      var dur = code[i] === '.' ? DIT : DIT * 3;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.3, t + 0.006);
      gain.gain.setValueAtTime(0.3, t + dur - 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      segments.push([t, t + dur]);
      t += dur + DIT;        // intra-character gap is one dit
    }

    osc.start(start);
    osc.stop(t + 0.05);
    playing = { osc: osc, gain: gain, segments: segments, endsAt: t };
  }

  function stopTone() {
    if (!playing || !ctx) { playing = null; return; }
    try {
      playing.gain.gain.cancelScheduledValues(ctx.currentTime);
      playing.gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      playing.osc.stop(ctx.currentTime + 0.02);
    } catch (e) {}
    playing = null;
  }

  function isSounding() {
    if (!playing || !ctx) return false;
    var now = ctx.currentTime;
    for (var i = 0; i < playing.segments.length; i++) {
      if (now >= playing.segments[i][0] && now < playing.segments[i][1]) return true;
    }
    return false;
  }

  /* ---------- waveform ---------- */

  var BARS = 21;
  var bars = [];
  for (var b = 0; b < BARS; b++) {
    var bar = document.createElement('div');
    bar.className = 'wave__bar';
    el.wave.appendChild(bar);
    bars.push(bar);
  }

  function tick(ts) {
    var on = isSounding();
    for (var i = 0; i < BARS; i++) {
      var h;
      if (on) {
        // deterministic pseudo-waveform: a couple of detuned sines per bar
        var mid = 1 - Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2);
        var w = Math.sin(ts / 90 + i * 0.9) * 0.5 + Math.sin(ts / 47 + i * 1.7) * 0.5;
        h = 6 + (0.35 + 0.65 * mid) * (26 + w * 22);
      } else {
        h = 3;
      }
      bars[i].style.height = Math.max(3, h).toFixed(1) + 'px';
      bars[i].style.opacity = on ? '1' : '.45';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------- home ---------- */

  function nextLocked() {
    for (var i = 0; i < POOL.length; i++) {
      if (state.known.indexOf(POOL[i]) === -1) return POOL[i];
    }
    return null;
  }

  function renderHome() {
    var next = nextLocked();

    el.knownCount.textContent = state.known.length;
    el.poolOf.textContent = 'of ' + POOL.length;
    el.poolRing.style.setProperty('--p', (state.known.length / POOL.length * 100).toFixed(1));
    el.knownLabel.textContent = state.known.length === 1 ? 'character known' : 'characters known';

    el.knownSet.innerHTML = '';
    state.known.forEach(function (c) {
      var chip = document.createElement('span');
      chip.className = 'known__chip';
      chip.textContent = c;
      el.knownSet.appendChild(chip);
    });
    if (next) {
      var lock = document.createElement('span');
      lock.className = 'known__chip known__chip--next';
      lock.textContent = next;
      el.knownSet.appendChild(lock);
    }

    el.bestStat.innerHTML = '<em>' + Math.round(state.best * 100) + '%</em>';
    el.nextStat.textContent = next ? next : 'done';
    setMode(state.mode, true);
  }

  function setMode(mode, quiet) {
    state.mode = mode;
    el.modeType.classList.toggle('is-on', mode === 'type');
    el.modeTap.classList.toggle('is-on', mode === 'tap');
    el.modeHint.textContent = mode === 'type'
      ? 'Answer on the keyboard'
      : 'Answer by tapping the letter';
    el.typeInput.style.display = mode === 'type' ? '' : 'none';
    el.tapGrid.style.display = mode === 'tap' ? '' : 'none';
    if (!quiet) save();
  }

  el.modeType.addEventListener('click', function () { setMode('type'); });
  el.modeTap.addEventListener('click', function () { setMode('tap'); });

  /* ---------- session ---------- */

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildGrid() {
    el.tapGrid.innerHTML = '';
    shuffled(state.known).forEach(function (c) {
      var key = document.createElement('button');
      key.type = 'button';
      key.className = 'key';
      key.textContent = c;
      key.addEventListener('click', function () { answer(c, key); });
      el.tapGrid.appendChild(key);
    });
  }

  function buildSegs() {
    el.segs.innerHTML = '';
    session.segs = [];
    for (var i = 0; i < SESSION_LEN; i++) {
      var s = document.createElement('div');
      s.className = 'seg';
      el.segs.appendChild(s);
      session.segs.push(s);
    }
  }

  function startSession() {
    // The tap that got us here is the only gesture we get, so unlock on it —
    // synchronously, before any of the setup below yields.
    var ready = unlockAudio();

    session = {
      i: 0,
      accepting: false,
      chars: [],
      segs: [],
      stats: {}       // char -> { hit, total }
    };
    for (var n = 0; n < SESSION_LEN; n++) {
      session.chars.push(state.known[Math.floor(Math.random() * state.known.length)]);
    }
    state.known.forEach(function (c) { session.stats[c] = { hit: 0, total: 0 }; });

    buildGrid();
    buildSegs();
    setMode(state.mode, true);
    hideEcho();
    updateCounter();
    show('session');
    if (state.mode === 'type') focusInput();

    // Only start the run once the context is genuinely running — scheduling
    // against a suspended context is what made v1 silent.
    ready.then(function (ok) {
      el.audioWarn.classList.toggle('is-on', !ok);
      setTimeout(nextChar, 400);
    });
  }

  function focusInput() {
    el.typeInput.value = '';
    try { el.typeInput.focus({ preventScroll: true }); } catch (e) { el.typeInput.focus(); }
  }

  function updateCounter() {
    var done = session ? session.i : 0;
    el.counter.innerHTML = '<b>' + done + '</b> / ' + SESSION_LEN;
  }

  function hideEcho() {
    el.echo.className = 'echo';
    el.wave.style.display = '';
  }

  function nextChar() {
    if (!session) return;
    if (session.i >= SESSION_LEN) { finish(); return; }
    el.prompt.className = 'session__prompt';
    el.prompt.textContent = state.mode === 'type' ? 'Type what you hear' : 'Tap what you hear';
    session.segs[session.i].classList.add('is-now');
    session.accepting = true;
    el.replayBtn.disabled = false;
    playChar(session.chars[session.i]);
  }

  function answer(ch, keyEl) {
    if (!session || !session.accepting) return;
    session.accepting = false;
    el.replayBtn.disabled = true;
    stopTone();

    var want = session.chars[session.i];
    var ok = ch === want;
    var st = session.stats[want] || (session.stats[want] = { hit: 0, total: 0 });
    st.total++;
    if (ok) st.hit++;

    // instant feedback: full-bleed wash, the answer echoed over the stage,
    // the run segment locked to its outcome, and the key itself
    el.flash.className = 'flash ' + (ok ? 'is-good' : 'is-bad');
    el.wave.style.display = 'none';
    el.echo.className = 'echo is-on ' + (ok ? 'is-good' : 'is-bad');
    el.echoCh.textContent = ch;
    el.echoWas.textContent = ok ? '' : 'it was ' + want;
    el.prompt.className = 'session__prompt ' + (ok ? 'is-good' : 'is-bad');
    el.prompt.textContent = ok ? 'Correct' : 'Miss';

    var seg = session.segs[session.i];
    seg.classList.remove('is-now');
    seg.classList.add(ok ? 'is-good' : 'is-bad');

    if (keyEl) {
      keyEl.classList.add(ok ? 'is-good' : 'is-bad');
      setTimeout(function () { keyEl.classList.remove('is-good', 'is-bad'); }, 260);
    }
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 12 : [16, 40, 16]); } catch (e) {} }

    session.i++;
    updateCounter();

    setTimeout(function () { el.flash.className = 'flash'; }, 240);
    setTimeout(function () {
      if (!session) return;
      hideEcho();
      if (state.mode === 'type') focusInput();
      nextChar();
    }, GAP_AFTER_ANSWER);
  }

  // Replay costs nothing — it re-sends the same character, which is also the
  // recovery path if the browser swallowed the first tone.
  el.replayBtn.addEventListener('click', function () {
    if (!session || !session.accepting) return;
    unlockAudio().then(function (ok) {
      el.audioWarn.classList.toggle('is-on', !ok);
      playChar(session.chars[session.i]);
    });
    if (state.mode === 'type') focusInput();
  });

  // Type mode: every keystroke is an answer, no submit step.
  el.typeInput.addEventListener('input', function () {
    var v = el.typeInput.value.toUpperCase().replace(/[^A-Z]/g, '');
    el.typeInput.value = '';
    if (!v) return;
    answer(v.charAt(v.length - 1), null);
  });

  // Physical keyboards, for anyone opening this on a desktop.
  document.addEventListener('keydown', function (e) {
    if (!session || !session.accepting) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key || '').toUpperCase();
    if (k.length === 1 && k >= 'A' && k <= 'Z') {
      if (document.activeElement === el.typeInput) return;   // handled by input
      answer(k, null);
    }
  });

  /* ---------- results ---------- */

  function finish() {
    stopTone();
    el.typeInput.blur();

    var hit = 0, total = 0;
    state.known.forEach(function (c) {
      var s = session.stats[c];
      if (s) { hit += s.hit; total += s.total; }
    });
    var acc = total ? hit / total : 0;
    var passed = acc >= PASS;

    if (acc > state.best) state.best = acc;

    var unlocked = null;
    if (passed) {
      unlocked = nextLocked();
      if (unlocked) state.known.push(unlocked);
    }
    save();

    el.scoreHero.textContent = Math.round(acc * 100) + '%';
    el.scoreRing.style.setProperty('--p', (acc * 100).toFixed(1));
    el.scoreRing.style.setProperty('--ring-color', passed ? 'var(--accent)' : 'var(--bad)');
    el.verdictLine.textContent = passed
      ? (unlocked ? "You're copying it." : 'Pool complete.')
      : 'Not quite — run it again.';
    el.hitCount.textContent = hit;
    el.missCount.textContent = total - hit;
    el.passNote.textContent = passed ? 'passed' : '90% to unlock';

    el.unlockBanner.classList.toggle('is-on', !!unlocked);
    if (unlocked) el.unlockChar.textContent = unlocked;

    el.breakdown.innerHTML = '';
    Object.keys(session.stats).forEach(function (c) {
      var s = session.stats[c];
      var row = document.createElement('div');
      row.className = 'row' + (s.total && s.hit < s.total ? ' is-weak' : '');

      var name = document.createElement('span');
      name.className = 'row__char';
      name.textContent = c;

      var bar = document.createElement('div');
      bar.className = 'row__bar';
      var good = document.createElement('div');
      var bad = document.createElement('div');
      good.className = 'row__fill';
      bad.className = 'row__fill row__fill--bad';
      if (s.total) {
        good.style.width = (s.hit / s.total * 100) + '%';
        bad.style.width = ((s.total - s.hit) / s.total * 100) + '%';
      }
      bar.appendChild(good);
      bar.appendChild(bad);

      var num = document.createElement('span');
      num.className = 'row__num';
      num.textContent = s.total ? s.hit + '/' + s.total : '—';

      row.appendChild(name);
      row.appendChild(bar);
      row.appendChild(num);
      el.breakdown.appendChild(row);
    });

    session = null;
    show('results');
  }

  /* ---------- wiring ---------- */

  function goHome() {
    session = null;
    stopTone();
    el.typeInput.blur();
    renderHome();
    show('home');
  }

  el.startBtn.addEventListener('click', startSession);
  el.againBtn.addEventListener('click', startSession);
  el.homeBtn.addEventListener('click', goHome);
  el.quitBtn.addEventListener('click', goHome);

  // Leaving the session by any route should not keep a tone running.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopTone();
  });

  load();
  renderHome();
  show('home');

  // /APP LOGIC
</script>

</body>
</html>
