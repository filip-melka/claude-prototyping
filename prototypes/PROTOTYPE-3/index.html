<!doctype html>
<!--
  PROTOTYPE-3 — Koch Code
  Morse trainer on the Koch method: full-speed characters, wide Farnsworth gaps,
  a new character unlocks at 90% accuracy. Two answer modes to compare: Type vs Tap.
  Self-contained: tones are synthesised with the Web Audio API, progress lives in
  localStorage. No network, no build step.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Koch Code</title>
<style>
  /* Dark is the intended look; light is a paper-terminal translation of it. */
  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --surface-2: #e2e7e2;
    --text: #101512;
    --muted: #61706a;
    --border: #d2dad4;
    --accent: #067a42;
    --accent-dim: rgba(6, 122, 66, .16);
    --accent-text: #ffffff;
    --bad: #c4392c;
    --bad-dim: rgba(196, 57, 44, .16);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1210;
      --surface: #141b18;
      --surface-2: #1c2521;
      --text: #e8f0ea;
      --muted: #7d8f86;
      --border: #24302b;
      --accent: #39ff88;
      --accent-dim: rgba(57, 255, 136, .14);
      --accent-text: #06110b;
      --bad: #ff5c4d;
      --bad-dim: rgba(255, 92, 77, .16);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }

  /* App shell: full-bleed, no nav chrome beyond the gallery back link. */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 10px)
      calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 16px);
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
  }

  .app__header {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    height: 34px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: none;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    line-height: 1;
  }

  .back:active { transform: scale(.94); }

  .counter {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: .04em;
    color: var(--muted);
    visibility: hidden;
  }
  .counter.is-on { visibility: visible; }
  .counter b { color: var(--accent); font-weight: 600; }

  .app__body {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .screen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .screen.is-active { display: flex; }

  /* ---------- home ---------- */

  .home__top {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 0;
  }

  .hero {
    font-family: var(--mono);
    font-size: 88px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: -.04em;
    color: var(--accent);
  }

  .hero__label {
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .known {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 300px;
  }

  .known__chip {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 5px 10px;
    border-radius: 8px;
    background: var(--accent-dim);
    color: var(--accent);
  }

  .stat {
    margin-top: 20px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .home__bottom { flex: none; display: flex; flex-direction: column; gap: 14px; }

  .toggle {
    display: flex;
    padding: 4px;
    gap: 4px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }

  .toggle__btn {
    appearance: none;
    flex: 1;
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    letter-spacing: .02em;
    cursor: pointer;
    transition: background-color .16s ease, color .16s ease;
  }
  .toggle__btn.is-on { background: var(--accent); color: var(--accent-text); }
  .toggle__btn:active { transform: scale(.985); }

  .toggle__hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin: -6px 0 0;
  }

  .btn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    min-height: 54px;
    padding: 0 20px;
    width: 100%;
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); }

  .btn--ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
  }

  /* ---------- session ---------- */

  .wave {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 120px;
  }

  .wave__bar {
    width: 6px;
    height: 3px;
    border-radius: 3px;
    background: var(--accent);
    opacity: .5;
    transition: height .05s linear, opacity .05s linear;
  }
  .wave.is-bad .wave__bar { background: var(--bad); }

  .session__prompt {
    flex: none;
    text-align: center;
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    min-height: 20px;
  }

  .session__answer {
    flex: none;
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 78px;
  }

  /* the last answer, echoed big */
  .echo {
    font-family: var(--mono);
    font-size: 64px;
    line-height: 1;
    font-weight: 600;
    color: var(--muted);
    opacity: 0;
    transform: scale(.9);
    transition: opacity .12s ease, transform .12s ease;
  }
  .echo.is-on { opacity: 1; transform: scale(1); }
  .echo.is-good { color: var(--accent); }
  .echo.is-bad { color: var(--bad); }
  .echo__was {
    display: block;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: .08em;
    color: var(--muted);
    margin-top: 6px;
  }

  .input {
    appearance: none;
    width: 100%;
    min-height: 56px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .3em;
    text-align: center;
    text-transform: uppercase;
    user-select: text;
    outline: none;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .key {
    appearance: none;
    min-height: 56px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s ease, background-color .1s ease;
  }
  .key:active { transform: scale(.94); background: var(--surface-2); }
  .key.is-good { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .key.is-bad { background: var(--bad); border-color: var(--bad); color: #fff; }

  .session__foot { flex: none; padding-top: 12px; }

  /* full-bleed right/wrong flash */
  .flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: var(--accent);
    transition: opacity .22s ease;
  }
  .flash.is-good { opacity: .14; }
  .flash.is-bad { background: var(--bad); opacity: .16; }

  /* ---------- results ---------- */

  .results { overflow-y: auto; }

  .results__top {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 4px;
  }

  .unlock {
    flex: none;
    margin: 14px 0 2px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: .04em;
    text-align: center;
    display: none;
  }
  .unlock.is-on { display: block; }
  .unlock b { font-size: 20px; }

  .breakdown {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin: 18px 0 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .row { display: flex; align-items: center; gap: 10px; }

  .row__char {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    width: 20px;
    flex: none;
    color: var(--text);
  }

  .row__bar {
    flex: 1;
    height: 10px;
    border-radius: 5px;
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
  }

  .row__fill { height: 100%; background: var(--accent); }
  .row__fill--bad { background: var(--bad); }

  .row__num {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    width: 54px;
    flex: none;
    text-align: right;
    letter-spacing: .02em;
  }

  .results__foot { flex: none; display: flex; gap: 10px; }
  .results__foot .btn { flex: 1; }
</style>
</head>
<body>

<div class="app">
  <div class="flash" id="flash"></div>

  <header class="app__header">
    <a class="back" href="../../index.html" aria-label="Back to gallery">&larr;</a>
    <span class="counter" id="counter"><b>0</b> / 20</span>
  </header>

  <main class="app__body">
    <!-- APP MARKUP -->

    <!-- HOME -->
    <section class="screen is-active" id="screen-home">
      <div class="home__top">
        <div class="hero" id="knownCount">2</div>
        <div class="hero__label" id="knownLabel">characters known</div>
        <div class="known" id="knownSet"></div>
        <div class="stat" id="bestStat">best 0%</div>
      </div>

      <div class="home__bottom">
        <div class="toggle" role="group" aria-label="Input mode">
          <button class="toggle__btn is-on" id="modeType" type="button">Type</button>
          <button class="toggle__btn" id="modeTap" type="button">Tap</button>
        </div>
        <p class="toggle__hint" id="modeHint">Answer on the keyboard</p>
        <button class="btn" id="startBtn" type="button">Start session</button>
      </div>
    </section>

    <!-- SESSION -->
    <section class="screen" id="screen-session">
      <div class="wave" id="wave"></div>
      <div class="session__prompt" id="prompt">listen</div>

      <div class="session__answer">
        <div class="echo" id="echo"></div>
      </div>

      <div class="session__foot">
        <input class="input" id="typeInput" type="text" inputmode="text" maxlength="1"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               aria-label="Type the character you heard">
        <div class="grid" id="tapGrid"></div>
      </div>
    </section>

    <!-- RESULTS -->
    <section class="screen results" id="screen-results">
      <div class="results__top">
        <div class="hero" id="scoreHero">0%</div>
        <div class="hero__label" id="scoreLabel">accuracy</div>
      </div>

      <div class="unlock" id="unlockBanner">New character unlocked: <b id="unlockChar">J</b></div>

      <div class="breakdown" id="breakdown"></div>

      <div class="results__foot">
        <button class="btn btn--ghost" id="homeBtn" type="button">Home</button>
        <button class="btn" id="againBtn" type="button">Again</button>
      </div>
    </section>

    <!-- /APP MARKUP -->
  </main>
</div>

<script>
  // APP LOGIC

  /* ---------- data ---------- */

  // Koch order, trimmed to a 16-character pool — enough to show progression
  // without a tap grid that stops being thumb-sized.
  var POOL = ['K','M','R','S','U','A','P','T','L','O','W','I','N','J','E','F'];

  var MORSE = {
    K: '-.-', M: '--', R: '.-.', S: '...', U: '..-', A: '.-', P: '.--.', T: '-',
    L: '.-..', O: '---', W: '.--', I: '..', N: '-.', J: '.---', E: '.', F: '..-.'
  };

  var SESSION_LEN = 20;
  var PASS = 0.9;
  var STORE = 'koch-code-v1';

  // 20 wpm character speed: one dit is 1200/20 ms. Farnsworth gap is the long
  // pause between characters, which is what actually makes Koch learnable.
  var DIT = 0.06;
  var GAP_AFTER_ANSWER = 620;
  var TONE_HZ = 620;

  /* ---------- state ---------- */

  var state = {
    known: ['K', 'M'],
    best: 0,
    mode: 'type'   // 'type' | 'tap'
  };

  var session = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (Array.isArray(s.known) && s.known.length) {
        var clean = s.known.filter(function (c) { return POOL.indexOf(c) !== -1; });
        if (clean.length) state.known = clean;
      }
      if (typeof s.best === 'number') state.best = s.best;
      if (s.mode === 'type' || s.mode === 'tap') state.mode = s.mode;
    } catch (e) { /* first run, or storage blocked — defaults are fine */ }
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- elements ---------- */

  var el = {};
  ['screen-home','screen-session','screen-results','knownCount','knownLabel','knownSet',
   'bestStat','modeType','modeTap','modeHint','startBtn','wave','prompt','echo','typeInput',
   'tapGrid','counter','flash','scoreHero','scoreLabel','unlockBanner','unlockChar',
   'breakdown','homeBtn','againBtn'].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  function show(name) {
    ['home', 'session', 'results'].forEach(function (n) {
      el['screen-' + n].classList.toggle('is-active', n === name);
    });
    el.counter.classList.toggle('is-on', name === 'session');
  }

  /* ---------- audio ---------- */

  var ctx = null;
  var playing = null;   // { osc, gain, segments, endsAt }

  function ensureAudio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Schedules one character as a gain envelope on a single oscillator, and
  // records when it is actually sounding so the waveform can follow it.
  function playChar(ch) {
    stopTone();
    if (!ensureAudio()) return;

    var code = MORSE[ch] || '.';
    var gain = ctx.createGain();
    var osc = ctx.createOscillator();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    osc.type = 'sine';
    osc.frequency.value = TONE_HZ;
    osc.connect(gain);
    gain.connect(ctx.destination);

    var t = ctx.currentTime + 0.08;
    var segments = [];
    for (var i = 0; i < code.length; i++) {
      var dur = code[i] === '.' ? DIT : DIT * 3;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.006);
      gain.gain.setValueAtTime(0.25, t + dur - 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      segments.push([t, t + dur]);
      t += dur + DIT;        // intra-character gap is one dit
    }

    osc.start(ctx.currentTime);
    osc.stop(t + 0.05);
    playing = { osc: osc, gain: gain, segments: segments, endsAt: t };
  }

  function stopTone() {
    if (!playing || !ctx) { playing = null; return; }
    try {
      playing.gain.gain.cancelScheduledValues(ctx.currentTime);
      playing.gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      playing.osc.stop(ctx.currentTime + 0.02);
    } catch (e) {}
    playing = null;
  }

  function isSounding() {
    if (!playing || !ctx) return false;
    var now = ctx.currentTime;
    for (var i = 0; i < playing.segments.length; i++) {
      if (now >= playing.segments[i][0] && now < playing.segments[i][1]) return true;
    }
    return false;
  }

  /* ---------- waveform ---------- */

  var BARS = 21;
  var bars = [];
  for (var b = 0; b < BARS; b++) {
    var bar = document.createElement('div');
    bar.className = 'wave__bar';
    el.wave.appendChild(bar);
    bars.push(bar);
  }

  var raf = null;
  function tick(ts) {
    var on = isSounding();
    for (var i = 0; i < BARS; i++) {
      var h;
      if (on) {
        // deterministic pseudo-waveform: a couple of detuned sines per bar
        var mid = 1 - Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2);
        var w = Math.sin(ts / 90 + i * 0.9) * 0.5 + Math.sin(ts / 47 + i * 1.7) * 0.5;
        h = 6 + (0.35 + 0.65 * mid) * (26 + w * 22);
      } else {
        h = 3;
      }
      bars[i].style.height = Math.max(3, h).toFixed(1) + 'px';
      bars[i].style.opacity = on ? '1' : '.45';
    }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  /* ---------- home ---------- */

  function nextLocked() {
    for (var i = 0; i < POOL.length; i++) {
      if (state.known.indexOf(POOL[i]) === -1) return POOL[i];
    }
    return null;
  }

  function renderHome() {
    el.knownCount.textContent = state.known.length;
    el.knownLabel.textContent = state.known.length === 1 ? 'character known' : 'characters known';
    el.knownSet.innerHTML = '';
    state.known.forEach(function (c) {
      var chip = document.createElement('span');
      chip.className = 'known__chip';
      chip.textContent = c;
      el.knownSet.appendChild(chip);
    });
    el.bestStat.textContent = 'best ' + Math.round(state.best * 100) + '%'
      + (nextLocked() ? '' : '  ·  pool complete');
    setMode(state.mode, true);
  }

  function setMode(mode, quiet) {
    state.mode = mode;
    el.modeType.classList.toggle('is-on', mode === 'type');
    el.modeTap.classList.toggle('is-on', mode === 'tap');
    el.modeHint.textContent = mode === 'type'
      ? 'Answer on the keyboard'
      : 'Answer by tapping the letter';
    el.typeInput.style.display = mode === 'type' ? '' : 'none';
    el.tapGrid.style.display = mode === 'tap' ? '' : 'none';
    if (!quiet) save();
  }

  el.modeType.addEventListener('click', function () { setMode('type'); });
  el.modeTap.addEventListener('click', function () { setMode('tap'); });

  /* ---------- session ---------- */

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildGrid() {
    el.tapGrid.innerHTML = '';
    shuffled(state.known).forEach(function (c) {
      var key = document.createElement('button');
      key.type = 'button';
      key.className = 'key';
      key.textContent = c;
      key.addEventListener('click', function () { answer(c, key); });
      el.tapGrid.appendChild(key);
    });
  }

  function startSession() {
    ensureAudio();   // unlocked by this tap, which is the only gesture we get
    session = {
      i: 0,
      accepting: false,
      chars: [],
      stats: {}       // char -> { hit, total }
    };
    for (var n = 0; n < SESSION_LEN; n++) {
      session.chars.push(state.known[Math.floor(Math.random() * state.known.length)]);
    }
    state.known.forEach(function (c) { session.stats[c] = { hit: 0, total: 0 }; });

    buildGrid();
    setMode(state.mode, true);
    el.echo.className = 'echo';
    el.echo.textContent = '';
    updateCounter();
    show('session');
    if (state.mode === 'type') focusInput();
    setTimeout(nextChar, 500);
  }

  function focusInput() {
    el.typeInput.value = '';
    try { el.typeInput.focus({ preventScroll: true }); } catch (e) { el.typeInput.focus(); }
  }

  function updateCounter() {
    var done = session ? session.i : 0;
    el.counter.innerHTML = '<b>' + done + '</b> / ' + SESSION_LEN;
  }

  function nextChar() {
    if (!session) return;
    if (session.i >= SESSION_LEN) { finish(); return; }
    el.prompt.textContent = 'listen';
    el.wave.classList.remove('is-bad');
    session.accepting = true;
    playChar(session.chars[session.i]);
  }

  function answer(ch, keyEl) {
    if (!session || !session.accepting) return;
    session.accepting = false;
    stopTone();

    var want = session.chars[session.i];
    var ok = ch === want;
    var st = session.stats[want] || (session.stats[want] = { hit: 0, total: 0 });
    st.total++;
    if (ok) st.hit++;

    // instant flash: full-bleed wash, the echoed answer, and the key itself
    el.flash.className = 'flash ' + (ok ? 'is-good' : 'is-bad');
    el.echo.className = 'echo is-on ' + (ok ? 'is-good' : 'is-bad');
    el.echo.innerHTML = ok
      ? ch
      : ch + '<span class="echo__was">was ' + want + '</span>';
    el.wave.classList.toggle('is-bad', !ok);
    el.prompt.textContent = ok ? 'correct' : 'miss';
    if (keyEl) {
      keyEl.classList.add(ok ? 'is-good' : 'is-bad');
      setTimeout(function () { keyEl.classList.remove('is-good', 'is-bad'); }, 260);
    }
    if (navigator.vibrate) { try { navigator.vibrate(ok ? 12 : [16, 40, 16]); } catch (e) {} }

    session.i++;
    updateCounter();

    setTimeout(function () { el.flash.className = 'flash'; }, 240);
    setTimeout(function () {
      el.echo.className = 'echo';
      if (state.mode === 'type') focusInput();
      nextChar();
    }, GAP_AFTER_ANSWER);
  }

  // Type mode: every keystroke is an answer, no submit step.
  el.typeInput.addEventListener('input', function () {
    var v = el.typeInput.value.toUpperCase().replace(/[^A-Z]/g, '');
    el.typeInput.value = '';
    if (!v) return;
    answer(v.charAt(v.length - 1), null);
  });

  // Physical keyboards, for anyone opening this on a desktop.
  document.addEventListener('keydown', function (e) {
    if (!session || !session.accepting) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key || '').toUpperCase();
    if (k.length === 1 && k >= 'A' && k <= 'Z') {
      if (document.activeElement === el.typeInput) return;   // handled by input
      answer(k, null);
    }
  });

  /* ---------- results ---------- */

  function finish() {
    stopTone();
    el.typeInput.blur();

    var hit = 0, total = 0;
    state.known.forEach(function (c) {
      var s = session.stats[c];
      if (s) { hit += s.hit; total += s.total; }
    });
    var acc = total ? hit / total : 0;

    if (acc > state.best) state.best = acc;

    var unlocked = null;
    if (acc >= PASS) {
      unlocked = nextLocked();
      if (unlocked) state.known.push(unlocked);
    }
    save();

    el.scoreHero.textContent = Math.round(acc * 100) + '%';
    el.scoreHero.style.color = acc >= PASS ? 'var(--accent)' : 'var(--bad)';
    el.scoreLabel.textContent = acc >= PASS ? 'accuracy · passed' : 'accuracy · 90% to unlock';

    el.unlockBanner.classList.toggle('is-on', !!unlocked);
    if (unlocked) el.unlockChar.textContent = unlocked;

    el.breakdown.innerHTML = '';
    Object.keys(session.stats).forEach(function (c) {
      var s = session.stats[c];
      var row = document.createElement('div');
      row.className = 'row';

      var name = document.createElement('span');
      name.className = 'row__char';
      name.textContent = c;

      var bar = document.createElement('div');
      bar.className = 'row__bar';
      var good = document.createElement('div');
      var bad = document.createElement('div');
      good.className = 'row__fill';
      bad.className = 'row__fill row__fill--bad';
      if (s.total) {
        good.style.width = (s.hit / s.total * 100) + '%';
        bad.style.width = ((s.total - s.hit) / s.total * 100) + '%';
      }
      bar.appendChild(good);
      bar.appendChild(bad);

      var num = document.createElement('span');
      num.className = 'row__num';
      num.textContent = s.total ? s.hit + '/' + s.total : '—';

      row.appendChild(name);
      row.appendChild(bar);
      row.appendChild(num);
      el.breakdown.appendChild(row);
    });

    session = null;
    show('results');
  }

  /* ---------- wiring ---------- */

  el.startBtn.addEventListener('click', startSession);
  el.againBtn.addEventListener('click', startSession);
  el.homeBtn.addEventListener('click', function () { renderHome(); show('home'); });

  // Leaving the session by any route should not keep a tone running.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopTone();
  });

  load();
  renderHome();
  show('home');

  // /APP LOGIC
</script>

</body>
</html>
