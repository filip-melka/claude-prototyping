<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pasture Push</title>
<style>
  :root {
    /* The board is a toy sitting on the page, so its colours are fixed in
       both schemes. Only the surround and the text on it follow the OS. */
    --grass: #3fa65c;
    --grass-dot: rgba(15, 66, 34, .13);
    --shade: rgba(20, 74, 44, .28);

    --block-top: #b8834a;
    --block-side: #7d5427;
    --block-hi: rgba(255, 240, 214, .3);

    --pen-fill: #ffdc63;
    --pen-ring: #e09a12;
    --pen-dash: rgba(120, 74, 6, .55);

    --water: #23a3f2;
    --water-hi: #7fd4ff;
    --water-lo: #0f6fbe;

    --gold: #ffc42e;
    --gold-lip: #d3910a;
    --gold-ink: #4a3005;
    --ice: #5fd8ff;

    /* Cream/tan chrome with dark forest-green ink, in both schemes. */
    --cream: #fdf1d8;
    --cream-2: #f4e2ba;
    --cream-line: #e2c78f;
    --cream-lip: #d9bc85;
    --ink: #1f6b3a;
    --ink-dim: #4e8a63;

    --bg: linear-gradient(180deg, #a7e7bb 0%, #8fd9a8 52%, #7bcd97 100%);
    --onbg: #1f6b3a;
    --onbg-dim: #2f7d4a;

    --lift: calc(var(--cell, 40px) * .16);
    --slide: 160ms;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* Same pasture, after sundown — the board itself does not change. */
      --bg: linear-gradient(180deg, #17593b 0%, #0f3f29 60%, #0b3220 100%);
      --onbg: #e2f5e8;
      --onbg-dim: #9fcdb1;
      --cream: #f7e9cd;
      --cream-2: #ebd9ae;
    }
  }

  * { box-sizing: border-box; }

  /* Author display rules outrank the UA's [hidden], so say it out loud. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    background-attachment: fixed;
    color: var(--onbg);
    font: 600 16px/1.4 "Fredoka", "Baloo 2", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }

  .display { font-weight: 800; letter-spacing: -.015em; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .app {
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100dvh;
    padding:
      calc(env(safe-area-inset-top) + 10px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 12px)
      calc(env(safe-area-inset-left) + 14px);
    max-width: 430px;
    margin: 0 auto;
  }

  /* Top bar: HUD pill centred, close button pinned right ----------------- */
  .topbar {
    flex: none;
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px;
    align-items: center;
    gap: 6px;
  }

  .hud {
    grid-column: 2;                   /* column 1 is the spacer that balances the close button */
    justify-self: center;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 13px;
    border-radius: 999px;
    background: var(--cream);
    border: 2px solid var(--cream-line);
    box-shadow: 0 3px 0 var(--cream-lip), 0 6px 14px rgba(12, 60, 34, .18);
    color: var(--ink);
    white-space: nowrap;
  }

  .hud__grp {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
  }

  .hud__grp svg {
    width: 17px;
    height: 17px;
    display: block;
    flex: none;
  }

  .hud__grp--sheep svg { color: #2f8f4f; }
  .hud__grp--level svg { color: #d39a12; }
  .hud__grp--moves svg { color: #2a8ec9; }

  .hud__sep {
    width: 2px;
    height: 15px;
    border-radius: 1px;
    background: var(--cream-line);
    flex: none;
  }

  /* The gallery back link, wearing the close button the brief asked for. */
  .close {
    grid-column: 3;
    justify-self: end;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 999px;
    background: var(--cream);
    border: 2px solid var(--cream-line);
    box-shadow: 0 3px 0 var(--cream-lip);
    color: var(--ink);
    text-decoration: none;
  }

  .close svg { width: 19px; height: 19px; display: block; }
  .close:active { transform: translateY(3px); box-shadow: 0 0 0 var(--cream-lip); }

  /* Level caption -------------------------------------------------------- */
  .caption {
    flex: none;
    text-align: center;
    margin-top: -2px;
  }

  .caption__name {
    margin: 0;
    font-size: 21px;
    color: var(--onbg);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .22);
  }

  .caption__hint {
    margin: 1px 0 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--onbg-dim);
  }

  /* Board ---------------------------------------------------------------- */
  .board-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    touch-action: none;
  }

  /* Absolutely centred, so the size we give the board can never feed back
     into the free space we measured it against. */
  .board {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .grid {
    position: relative;
    width: calc(var(--cols) * var(--cell));
    height: calc(var(--rows) * var(--cell));
    /* visible on purpose: raised blocks stand proud of the footprint */
    overflow: visible;
  }

  .cel {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell);
    height: var(--cell);
    transform: translate(calc(var(--c) * var(--cell)), calc(var(--r) * var(--cell)));
  }

  /* One flat silhouette under the whole shape, so an irregular board reads
     as a solid object lifted off the grass rather than loose tiles. */
  .tile--shade {
    background: var(--shade);
    transform: translate(calc(var(--c) * var(--cell)), calc(var(--r) * var(--cell) + 6px));
  }

  .tile--grass, .tile--pen, .tile--mud {
    background-color: var(--grass);
    background-image: radial-gradient(circle at 50% 50%, var(--grass-dot) 0 1.6px, transparent 1.7px);
    background-size: calc(var(--cell) / 3) calc(var(--cell) / 3);
  }

  /* Raised block: shifted up by --lift, with the gap below filled by a
     darker side face. A block in the row beneath paints over that face, so a
     run of walls reads as one continuous ridge with a single lit edge. */
  .tile--wall::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 3px;
    background: var(--block-top);
    transform: translateY(calc(var(--lift) * -1));
    box-shadow:
      0 var(--lift) 0 var(--block-side),
      inset 0 2px 0 var(--block-hi),
      inset 0 -2px 0 rgba(90, 58, 24, .35);
  }

  .tile--pen::after {
    content: "";
    position: absolute;
    inset: 11%;
    border-radius: 999px;
    background: var(--pen-fill);
    box-shadow: inset 0 0 0 3px var(--pen-ring), 0 1px 3px rgba(90, 58, 6, .3);
  }

  .tile--pen::before {
    content: "";
    position: absolute;
    inset: 26%;
    z-index: 1;
    border-radius: 999px;
    border: 2px dashed var(--pen-dash);
  }

  .tile--mud::after {
    content: "";
    position: absolute;
    inset: 7%;
    border-radius: 34%;
    background:
      radial-gradient(ellipse 60% 34% at 38% 26%, var(--water-hi) 0%, transparent 70%),
      linear-gradient(180deg, var(--water) 0%, var(--water-lo) 100%);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .3);
  }

  /* Entities ------------------------------------------------------------- */
  .ent {
    transition: transform var(--slide) ease;
    will-change: transform;
  }

  .ent svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Gold is "safe" throughout — pens, locked sheep, the lock-in ring. */
  .ent--sheep.is-locked svg {
    filter: drop-shadow(0 0 6px rgba(255, 196, 46, .95)) drop-shadow(0 0 2px rgba(255, 220, 99, .9));
  }

  .pulse { pointer-events: none; z-index: 200; }

  .pulse::after {
    content: "";
    position: absolute;
    inset: 4%;
    border-radius: 999px;
    border: 4px solid var(--gold);
    animation: ring 520ms ease-out forwards;
  }

  @keyframes ring {
    from { transform: scale(.5); opacity: 1; }
    to   { transform: scale(1.7); opacity: 0; }
  }

  /* Legend --------------------------------------------------------------- */
  .legend {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--onbg-dim);
  }

  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .legend i {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    flex: none;
  }

  .legend .sw--fence { background: var(--block-top); box-shadow: 0 2px 0 var(--block-side); }
  .legend .sw--pen   { background: var(--pen-fill); box-shadow: inset 0 0 0 3px var(--pen-ring); border-radius: 999px; }
  .legend .sw--mud   { background: linear-gradient(180deg, var(--water-hi), var(--water-lo)); }
  .legend .sw--fox   { background: linear-gradient(135deg, #e2703f, #a83f1c); }

  /* Controls ------------------------------------------------------------- */
  .controls {
    flex: none;
    display: grid;
    /* minmax(0, …), not 1fr: a bare 1fr refuses to shrink past min-content
       and pushes the row wider than the screen on a 320px phone. */
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 10px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 46px);
    gap: 4px;
  }

  .dpad button:nth-child(1) { grid-area: 1 / 2; }
  .dpad button:nth-child(2) { grid-area: 2 / 1; }
  .dpad button:nth-child(3) { grid-area: 2 / 3; }
  .dpad button:nth-child(4) { grid-area: 3 / 2; }

  /* Chunky, high-contrast, and sitting on a visible lip. */
  .btn {
    appearance: none;
    border: 2px solid var(--cream-line);
    border-radius: 16px;
    background: var(--cream);
    color: var(--ink);
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    min-height: 46px;
    padding: 0 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 4px 0 var(--cream-lip);
    transition: transform 90ms ease, box-shadow 90ms ease;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--cream-lip);
  }

  .btn:disabled {
    opacity: .45;
    box-shadow: 0 4px 0 var(--cream-lip);
    transform: none;
  }

  .btn svg { width: 20px; height: 20px; display: block; flex: none; }

  .btn--pad { padding: 0; font-size: 22px; }
  .btn--pad svg { width: 24px; height: 24px; }

  .btn--gold {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--gold-ink);
    box-shadow: 0 4px 0 var(--gold-lip);
  }

  .btn--gold:active { box-shadow: 0 0 0 var(--gold-lip); }
  .btn--gold:disabled { box-shadow: 0 4px 0 var(--gold-lip); }

  .btn--side { width: 100%; min-width: 0; }

  /* Level pips ----------------------------------------------------------- */
  .pips {
    flex: none;
    display: flex;
    justify-content: center;
    gap: 7px;
  }

  .pip {
    appearance: none;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    border: 2px solid var(--cream-line);
    background: var(--cream);
    color: var(--ink-dim);
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--cream-lip);
    transition: transform 90ms ease, box-shadow 90ms ease;
  }

  .pip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--cream-lip); }

  .pip[aria-current="true"] {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--gold-ink);
    box-shadow: 0 3px 0 var(--gold-lip);
  }

  .pip.is-done:not([aria-current="true"]) {
    color: var(--ink);
    border-color: var(--pen-ring);
  }

  /* Speech-bubble card, anchored to the bottom edge ---------------------- */
  .bubble {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    max-width: 460px;
    margin: 0 auto;
    padding:
      20px
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 20px)
      calc(env(safe-area-inset-left) + 20px);
    background: var(--cream);
    border: 3px solid var(--cream-line);
    border-bottom: 0;
    border-radius: 30px 30px 0 0;
    box-shadow: 0 -8px 28px rgba(9, 48, 27, .28);
    color: var(--ink);
    text-align: center;
    animation: rise 260ms cubic-bezier(.2, .9, .3, 1.15) both;
  }

  @keyframes rise {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  /* The small circular button tucked into the card's corner. */
  .bubble__corner {
    position: absolute;
    top: -23px;
    right: 20px;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 999px;
    min-height: 0;
  }

  .bubble__title {
    margin: 0;
    font-size: 27px;
    line-height: 1.1;
  }

  .bubble__line {
    margin: 4px 0 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-dim);
  }

  .bubble__actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .bubble__actions .btn { flex: 1 1 0; min-width: 0; }

  @media (prefers-reduced-motion: reduce) {
    .ent { transition: none; }
    .pulse::after { animation: none; opacity: 0; }
    .bubble { animation: none; }
    .btn, .pip { transition: none; }
    .btn:active, .pip:active, .close:active { transform: none; }
  }

  /* Narrow phones: shrink the pad so Undo/Reset keep their labels. */
  @media (max-width: 360px) {
    .controls { gap: 8px; }
    .dpad { grid-template-columns: repeat(3, 46px); }
    .btn--side { padding: 0 6px; font-size: 13px; }
    .hud { gap: 7px; padding: 7px 11px; }
    .hud__grp { font-size: 13px; }
    .pip { width: 40px; }
  }

  /* Tall viewports have room to spare — spend it on the thumb controls. */
  @media (min-height: 780px) {
    .app { gap: 13px; }
    .dpad { grid-template-rows: repeat(3, 56px); }
  }

  /* Very short viewports: give the board what little is left. */
  @media (max-height: 660px) {
    .app { gap: 7px; }
    .caption__hint { display: none; }
    .legend { display: none; }
    .dpad { grid-template-rows: repeat(3, 40px); }
    .btn { min-height: 42px; }
  }
</style>
</head>
<body>

<!-- Sprites and icons: same-document symbols, no network. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="sp-sheep" viewBox="0 0 100 100">
    <rect x="30" y="66" width="8" height="17" rx="4" fill="#3a322c"/>
    <rect x="55" y="66" width="8" height="17" rx="4" fill="#3a322c"/>
    <g fill="#f7f1e1">
      <circle cx="45" cy="51" r="23"/>
      <circle cx="29" cy="45" r="14"/>
      <circle cx="58" cy="43" r="14"/>
      <circle cx="33" cy="62" r="14"/>
      <circle cx="56" cy="63" r="13"/>
    </g>
    <ellipse cx="66" cy="32" rx="6.5" ry="4" fill="#2e2823" transform="rotate(-28 66 32)"/>
    <ellipse cx="74" cy="43" rx="12.5" ry="14.5" fill="#3a322c"/>
    <circle cx="79" cy="39" r="2.6" fill="#f7f1e1"/>
  </symbol>

  <symbol id="sp-farmer" viewBox="0 0 100 100">
    <circle cx="50" cy="60" r="26" fill="#c1443c"/>
    <path d="M28 74 Q50 84 72 74 L72 84 Q50 92 28 84 Z" fill="#a5372f"/>
    <circle cx="50" cy="35" r="14.5" fill="#e6b489"/>
    <circle cx="45" cy="35" r="2.2" fill="#3a322c"/>
    <circle cx="55" cy="35" r="2.2" fill="#3a322c"/>
    <path d="M36 27 Q39 11 50 11 Q61 11 64 27 Z" fill="#ecdcae"/>
    <ellipse cx="50" cy="27" rx="27" ry="7" fill="#ecdcae"/>
    <ellipse cx="50" cy="27" rx="27" ry="7" fill="none" stroke="#cbb27f" stroke-width="1.6"/>
  </symbol>

  <!-- Low and long, so it never reads as one of the flock. -->
  <symbol id="sp-fox" viewBox="0 0 100 100">
    <path d="M20 62 Q2 54 6 38 Q14 30 20 34 Q10 44 20 50 Q26 54 32 56 Z" fill="#a83f1c"/>
    <rect x="32" y="66" width="7" height="14" rx="3.5" fill="#a83f1c"/>
    <rect x="60" y="66" width="7" height="14" rx="3.5" fill="#a83f1c"/>
    <ellipse cx="52" cy="58" rx="33" ry="15" fill="#d1592c"/>
    <ellipse cx="56" cy="66" rx="18" ry="7" fill="#f6ece0"/>
    <path d="M63 43 L61 27 L74 37 Z" fill="#a83f1c"/>
    <path d="M79 39 L84 27 L89 41 Z" fill="#a83f1c"/>
    <circle cx="75" cy="50" r="13" fill="#d1592c"/>
    <path d="M84 44 L99 53 L84 60 Z" fill="#e2703f"/>
    <circle cx="98" cy="53" r="3" fill="#2a1a12"/>
    <circle cx="76" cy="47" r="2.6" fill="#2a1a12"/>
  </symbol>

  <symbol id="ic-sheep" viewBox="0 0 24 24">
    <circle cx="10.5" cy="13" r="5.6" fill="currentColor"/>
    <circle cx="6.4" cy="10.8" r="3.4" fill="currentColor"/>
    <circle cx="14" cy="10" r="3.4" fill="currentColor"/>
    <ellipse cx="17.4" cy="12.4" rx="3.3" ry="3.9" fill="currentColor"/>
    <rect x="7" y="17" width="2.2" height="4.4" rx="1.1" fill="currentColor"/>
    <rect x="12.4" y="17" width="2.2" height="4.4" rx="1.1" fill="currentColor"/>
  </symbol>

  <symbol id="ic-level" viewBox="0 0 24 24">
    <rect x="4" y="2.5" width="2.8" height="19" rx="1.4" fill="currentColor"/>
    <path d="M8 4h11.5l-2.9 4 2.9 4H8z" fill="currentColor"/>
  </symbol>

  <symbol id="ic-move" viewBox="0 0 24 24">
    <path d="M12 1.6 15.6 6H8.4zM12 22.4 8.4 18h7.2zM1.6 12 6 8.4v7.2zM22.4 12 18 15.6V8.4z" fill="currentColor"/>
    <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
  </symbol>

  <symbol id="ic-undo" viewBox="0 0 24 24">
    <path d="M8.5 7.5H15a5 5 0 0 1 0 10h-3.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M11.6 3.2 6.4 7.5l5.2 4.3z" fill="currentColor"/>
  </symbol>

  <symbol id="ic-reset" viewBox="0 0 24 24">
    <path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M20.6 2.6v6h-6z" fill="currentColor"/>
  </symbol>

  <symbol id="ic-close" viewBox="0 0 24 24">
    <path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>

  <symbol id="ic-up" viewBox="0 0 24 24"><path d="M12 4.5 20 15h-6v4.5h-4V15H4z" fill="currentColor"/></symbol>
  <symbol id="ic-down" viewBox="0 0 24 24"><path d="M12 19.5 4 9h6V4.5h4V9h6z" fill="currentColor"/></symbol>
  <symbol id="ic-left" viewBox="0 0 24 24"><path d="M4.5 12 15 4v6h4.5v4H15v6z" fill="currentColor"/></symbol>
  <symbol id="ic-right" viewBox="0 0 24 24"><path d="M19.5 12 9 20v-6H4.5v-4H9V4z" fill="currentColor"/></symbol>
</svg>

<div class="app">
  <h1 class="sr-only">Pasture Push</h1>

  <header class="topbar">
    <div class="hud">
      <span class="hud__grp hud__grp--sheep">
        <svg aria-hidden="true"><use href="#ic-sheep"></use></svg>
        <b id="hudPenned">0/1</b>
      </span>
      <span class="hud__sep"></span>
      <span class="hud__grp hud__grp--level">
        <svg aria-hidden="true"><use href="#ic-level"></use></svg>
        <b id="hudLevel">1/5</b>
      </span>
      <span class="hud__sep"></span>
      <span class="hud__grp hud__grp--moves">
        <svg aria-hidden="true"><use href="#ic-move"></use></svg>
        <b id="hudMoves">0</b>
      </span>
    </div>

    <a class="close" href="../../index.html" aria-label="Close, back to the gallery">
      <svg aria-hidden="true"><use href="#ic-close"></use></svg>
    </a>
  </header>

  <div class="caption">
    <p class="caption__name display" id="levelName">First Steps</p>
    <p class="caption__hint" id="levelHint">One swipe moves the whole farm.</p>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <div class="legend">
    <span><i class="sw--fence"></i>Fence</span>
    <span><i class="sw--pen"></i>Pen</span>
    <span><i class="sw--mud"></i>Mud</span>
    <span><i class="sw--fox"></i>Fox</span>
  </div>

  <div class="controls">
    <button class="btn btn--side" type="button" id="btnUndo">
      <svg aria-hidden="true"><use href="#ic-undo"></use></svg>Undo
    </button>
    <div class="dpad">
      <button class="btn btn--pad" type="button" data-dir="U" aria-label="Swipe up"><svg aria-hidden="true"><use href="#ic-up"></use></svg></button>
      <button class="btn btn--pad" type="button" data-dir="L" aria-label="Swipe left"><svg aria-hidden="true"><use href="#ic-left"></use></svg></button>
      <button class="btn btn--pad" type="button" data-dir="R" aria-label="Swipe right"><svg aria-hidden="true"><use href="#ic-right"></use></svg></button>
      <button class="btn btn--pad" type="button" data-dir="D" aria-label="Swipe down"><svg aria-hidden="true"><use href="#ic-down"></use></svg></button>
    </div>
    <button class="btn btn--side" type="button" id="btnReset">
      <svg aria-hidden="true"><use href="#ic-reset"></use></svg>Reset
    </button>
  </div>

  <div class="pips" id="pips"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>
</div>

<div class="bubble" id="bubble" role="dialog" aria-modal="false" aria-labelledby="bubbleTitle" hidden>
  <button class="btn bubble__corner" type="button" id="btnBubbleUndo" aria-label="Undo the last move">
    <svg aria-hidden="true"><use href="#ic-undo"></use></svg>
  </button>
  <h2 class="bubble__title display" id="bubbleTitle">Pen full!</h2>
  <p class="bubble__line" id="bubbleLine">Cleared in 2 moves</p>
  <div class="bubble__actions">
    <button class="btn" type="button" id="btnAgain">Replay</button>
    <button class="btn btn--gold" type="button" id="btnNext">Next level</button>
  </div>
</div>

<script>
  // ---- Levels -----------------------------------------------------------
  // # wall  . floor  P pen  M mud  F farmer  S sheep  X fox  " " absent
  // An absent cell is not part of the board at all: it renders as bare
  // background, and blocks movement the same way the edge of the world does.
  // Levels 1-4 are verbatim from the brief and hand-verified solvable.
  var LEVELS = [
    { name: "First Steps", hint: "Everything slides at once. Try right, then down.", rows: [
      "######",
      "#F.S.#",
      "#....#",
      "#...P#",
      "######"
    ]},
    { name: "Muddy Patch", hint: "Mud cuts a slide short.", rows: [
      "#######",
      "#F....#",
      "#.S...#",
      "#.....#",
      "#.M...#",
      "#.....#",
      "#.P...#",
      "#######"
    ]},
    { name: "Split the Flock", hint: "Two sheep, two pens, one fence between them.", rows: [
      "#########",
      "#F.S.S..#",
      "#.......#",
      "#..###..#",
      "#.......#",
      "#.P....P#",
      "#.......#",
      "#########"
    ]},
    { name: "Fox on the Prowl", hint: "The fox slides too — and it never stops for sheep.", rows: [
      "########",
      "#...S..#",
      "#......#",
      "#..F...#",
      "#P...X.#",
      "#......#",
      "########"
    ]},
    { name: "Round the Bend", hint: "The pasture bends. So does the chase.", rows: [
      "  ######",
      "  #..S.#",
      "###....#",
      "#F.....#",
      "#..#####",
      "#.X.#",
      "#P..#",
      "#####"
    ]}
  ];

  var DIRS = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
  var TILE = { "#": "wall", "P": "pen", "M": "mud" };
  var SPRITE = { farmer: "sp-farmer", sheep: "sp-sheep", fox: "sp-fox" };

  // ---- Elements ---------------------------------------------------------
  var app = document.querySelector(".app");
  var topbar = document.querySelector(".topbar");
  var caption = document.querySelector(".caption");
  var legendEl = document.querySelector(".legend");
  var controlsEl = document.querySelector(".controls");
  var boardWrap = document.getElementById("boardWrap");
  var board = document.getElementById("board");
  var grid = document.getElementById("grid");
  var bubble = document.getElementById("bubble");
  var bubbleTitle = document.getElementById("bubbleTitle");
  var bubbleLine = document.getElementById("bubbleLine");
  var btnBubbleUndo = document.getElementById("btnBubbleUndo");
  var btnAgain = document.getElementById("btnAgain");
  var btnNext = document.getElementById("btnNext");
  var btnUndo = document.getElementById("btnUndo");
  var btnReset = document.getElementById("btnReset");
  var pips = document.getElementById("pips");
  var live = document.getElementById("live");
  var hudPenned = document.getElementById("hudPenned");
  var hudLevel = document.getElementById("hudLevel");
  var hudMoves = document.getElementById("hudMoves");
  var levelName = document.getElementById("levelName");
  var levelHint = document.getElementById("levelHint");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  var state = null;      // { index, grid, cols, rows, entities, moves, status }
  var undoStack = [];
  var entityEls = {};    // entity id -> element
  var cleared = [];      // level indexes finished at least once

  // ---- Rules ------------------------------------------------------------
  function parseLevel(index) {
    var raw = LEVELS[index].rows;
    var cols = raw.reduce(function (m, row) { return Math.max(m, row.length); }, 0);
    // Short rows are padded with absent cells, so a level can be written as
    // the shape it is rather than as a padded rectangle.
    var rows = raw.map(function (row) {
      while (row.length < cols) row += " ";
      return row;
    });

    var g = rows.map(function (row) {
      return row.split("").map(function (ch) {
        return ch === " " ? null : (TILE[ch] || "floor");
      });
    });

    var entities = [];
    var id = 0;
    rows.forEach(function (row, r) {
      row.split("").forEach(function (ch, c) {
        if (ch === "F") entities.push({ id: id++, kind: "farmer", r: r, c: c, locked: false });
        if (ch === "S") entities.push({ id: id++, kind: "sheep", r: r, c: c, locked: false });
        if (ch === "X") entities.push({ id: id++, kind: "fox", r: r, c: c, locked: false });
      });
    });

    return {
      index: index, grid: g, cols: cols, rows: rows.length,
      entities: entities, moves: 0, status: "playing"
    };
  }

  // Off the grid and absent both come back falsy, so a hole in the board
  // stops a slide exactly the way the edge of the world does.
  function tileAt(r, c) { return state.grid[r] ? state.grid[r][c] : undefined; }

  function occupant(r, c, self) {
    for (var i = 0; i < state.entities.length; i++) {
      var e = state.entities[i];
      if (e !== self && e.r === r && e.c === c) return e;
    }
    return null;
  }

  // The farmer and every un-penned sheep move at once. Settling whoever is
  // furthest along the direction first is what makes that simultaneity work:
  // anything ahead of you has already stopped, so you stack up behind it.
  function slideAnimals(dir) {
    var d = DIRS[dir], dr = d[0], dc = d[1];
    var movers = state.entities.filter(function (e) {
      return e.kind === "farmer" || (e.kind === "sheep" && !e.locked);
    }).sort(function (a, b) {
      return (b.r * dr + b.c * dc) - (a.r * dr + a.c * dc);
    });

    var justLocked = [];
    movers.forEach(function (e) {
      for (;;) {
        var nr = e.r + dr, nc = e.c + dc;
        var t = tileAt(nr, nc);
        if (!t || t === "wall") break;
        if (occupant(nr, nc, e)) break;
        if (t === "pen" && e.kind === "sheep") {
          e.r = nr; e.c = nc; e.locked = true;
          justLocked.push(e);
          break;
        }
        e.r = nr; e.c = nc;
        if (t === "mud") break;             // mud stops anything, mid-slide
        // a pen is just floor under the farmer — he walks straight over it
      }
    });
    return justLocked;
  }

  // The fox slides after the flock. Walls, pens and the farmer stop it; an
  // un-penned sheep does not — it runs straight into the first one it meets.
  function slideFox(dir) {
    var fox = state.entities.filter(function (e) { return e.kind === "fox"; })[0];
    if (!fox) return null;
    var d = DIRS[dir], dr = d[0], dc = d[1];
    for (;;) {
      var nr = fox.r + dr, nc = fox.c + dc;
      var t = tileAt(nr, nc);
      if (!t || t === "wall" || t === "pen") break;
      var occ = occupant(nr, nc, fox);
      if (occ) {
        if (occ.kind === "sheep" && !occ.locked) { fox.r = nr; fox.c = nc; return occ; }
        break;                               // the farmer shields what is behind him
      }
      fox.r = nr; fox.c = nc;
      if (t === "mud") break;
    }
    return null;
  }

  function sheepStats() {
    var total = 0, done = 0;
    state.entities.forEach(function (e) {
      if (e.kind !== "sheep") return;
      total++;
      if (e.locked) done++;
    });
    return { total: total, done: done };
  }

  function isWon() {
    return state.entities.every(function (e) { return e.kind !== "sheep" || e.locked; });
  }

  function signature() {
    return state.entities.map(function (e) {
      return e.id + ":" + e.r + "," + e.c + "," + (e.locked ? 1 : 0);
    }).join("|");
  }

  function snapshot() {
    return {
      moves: state.moves,
      entities: state.entities.map(function (e) {
        return { id: e.id, r: e.r, c: e.c, locked: e.locked };
      })
    };
  }

  function restore(snap) {
    state.moves = snap.moves;
    snap.entities.forEach(function (s) {
      var e = state.entities.filter(function (x) { return x.id === s.id; })[0];
      e.r = s.r; e.c = s.c; e.locked = s.locked;
    });
    state.status = "playing";
  }

  // ---- Rendering --------------------------------------------------------
  function place(el, r, c) {
    el.style.setProperty("--r", r);
    el.style.setProperty("--c", c);
  }

  function buildLevel(index) {
    state = parseLevel(index);
    undoStack = [];
    entityEls = {};

    grid.textContent = "";
    board.style.setProperty("--cols", state.cols);
    board.style.setProperty("--rows", state.rows);

    var frag = document.createDocumentFragment();

    // One flat silhouette beneath the whole footprint, then the ground.
    state.grid.forEach(function (row, r) {
      row.forEach(function (t, c) {
        if (!t) return;                       // absent: nothing is drawn here
        var shade = document.createElement("div");
        shade.className = "cel tile--shade";
        place(shade, r, c);
        frag.appendChild(shade);
      });
    });

    state.grid.forEach(function (row, r) {
      row.forEach(function (t, c) {
        if (!t) return;
        var el = document.createElement("div");
        el.className = "cel tile--" + (t === "floor" ? "grass" : t);
        place(el, r, c);
        // Raised blocks stack by row, so a wall in front hides the side face
        // of the one behind it and a run reads as a single ridge.
        el.style.zIndex = t === "wall" ? 20 + r * 2 : 1;
        frag.appendChild(el);
      });
    });

    state.entities.forEach(function (e) {
      var el = document.createElement("div");
      el.className = "cel ent ent--" + e.kind;
      place(el, e.r, e.c);
      el.style.zIndex = 21 + e.r * 2;
      el.innerHTML = '<svg aria-hidden="true"><use href="#' + SPRITE[e.kind] + '"></use></svg>';
      entityEls[e.id] = el;
      frag.appendChild(el);
    });

    grid.appendChild(frag);
    hideBubble();
    sizeBoard();
    paint();
    announce(LEVELS[index].name + ". " + LEVELS[index].hint);
  }

  function paint() {
    state.entities.forEach(function (e) {
      var el = entityEls[e.id];
      place(el, e.r, e.c);
      el.style.zIndex = 21 + e.r * 2;
      el.classList.toggle("is-locked", e.kind === "sheep" && e.locked);
    });

    var s = sheepStats();
    levelName.textContent = LEVELS[state.index].name;
    levelHint.textContent = LEVELS[state.index].hint;
    hudPenned.textContent = s.done + "/" + s.total;
    hudLevel.textContent = (state.index + 1) + "/" + LEVELS.length;
    hudMoves.textContent = state.moves;
    btnUndo.disabled = undoStack.length === 0;
    btnBubbleUndo.disabled = undoStack.length === 0;
    paintPips();
  }

  function paintPips() {
    Array.prototype.slice.call(pips.children).forEach(function (b, i) {
      b.setAttribute("aria-current", i === state.index ? "true" : "false");
      b.classList.toggle("is-done", cleared.indexOf(i) !== -1);
    });
  }

  function pulseAt(e) {
    if (reduced.matches) return;
    var ring = document.createElement("div");
    ring.className = "cel pulse";
    place(ring, e.r, e.c);
    grid.appendChild(ring);
    setTimeout(function () { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 700);
  }

  // The board is absolutely centred inside a wrapper that simply takes what
  // the flex column has left over, so the size we hand the board can never
  // feed back into the space we measured it against.
  function sizeBoard() {
    if (!state) return;
    var free = boardWrap.clientHeight;
    var wide = boardWrap.clientWidth;
    if (!free || !wide) return;

    // Room for the raised blocks standing proud of the top row, plus the
    // silhouette that sits 6px below the bottom one.
    var cell = Math.floor(Math.min(wide / state.cols, (free - 8) / (state.rows + 0.16)));
    cell = Math.max(20, Math.min(74, cell));
    board.style.setProperty("--cell", cell + "px");
  }

  function announce(msg) { live.textContent = msg; }

  // ---- Bottom card ------------------------------------------------------
  function hideBubble() { bubble.hidden = true; }

  function showBubble(kind) {
    var last = state.index === LEVELS.length - 1;
    if (kind === "win") {
      var count = state.moves + (state.moves === 1 ? " move" : " moves");
      bubbleTitle.textContent = last ? "Every flock is home!" : "Pen full!";
      // No Next to move on to on the last level, so point at the way out.
      bubbleLine.textContent = last
        ? "Cleared in " + count + " — tap the field to pick another."
        : "Cleared in " + count;
      btnAgain.textContent = "Replay";
      btnNext.hidden = last;
    } else {
      bubbleTitle.textContent = "The fox got one!";
      bubbleLine.textContent = "Pens keep sheep safe — get there first.";
      btnAgain.textContent = "Try again";
      btnNext.hidden = true;
    }
    bubble.hidden = false;
    announce(bubbleTitle.textContent + " " + bubbleLine.textContent);
  }

  // ---- Turn -------------------------------------------------------------
  function move(dir) {
    if (!state || state.status !== "playing") return;

    var before = signature();
    var snap = snapshot();

    var justLocked = slideAnimals(dir);
    var caught = slideFox(dir);

    if (signature() === before) return;   // nothing shifted — not a turn

    undoStack.push(snap);
    state.moves++;
    paint();
    justLocked.forEach(pulseAt);

    if (caught) {
      state.status = "lost";
    } else if (isWon()) {
      state.status = "won";
      if (cleared.indexOf(state.index) === -1) cleared.push(state.index);
      paintPips();
    }

    if (state.status !== "playing") {
      var kind = state.status === "won" ? "win" : "lose";
      // Let the slide land first, so the last move is actually visible.
      setTimeout(function () { showBubble(kind); }, reduced.matches ? 0 : 200);
    }
  }

  function undo() {
    if (!undoStack.length) return;
    restore(undoStack.pop());
    hideBubble();
    paint();
  }

  function reset() {
    var snap = snapshot();                    // lets Undo step back out of a reset
    var fresh = parseLevel(state.index);
    restore({ moves: 0, entities: fresh.entities });
    if (snap.moves > 0) undoStack.push(snap);
    hideBubble();
    paint();
  }

  function goto(index) {
    if (index < 0 || index >= LEVELS.length) return;
    buildLevel(index);
  }

  // ---- Input ------------------------------------------------------------
  Array.prototype.slice.call(document.querySelectorAll("[data-dir]")).forEach(function (b) {
    b.addEventListener("click", function () { move(b.getAttribute("data-dir")); });
  });

  btnUndo.addEventListener("click", undo);
  btnBubbleUndo.addEventListener("click", undo);
  btnReset.addEventListener("click", reset);
  btnAgain.addEventListener("click", reset);
  btnNext.addEventListener("click", function () { goto(state.index + 1); });

  document.addEventListener("keydown", function (ev) {
    var map = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" };
    if (map[ev.key]) { ev.preventDefault(); move(map[ev.key]); }
    else if (ev.key === "z" || ev.key === "Z") undo();
    else if (ev.key === "r" || ev.key === "R") reset();
    else if (ev.key === "Escape") hideBubble();
  });

  // Swipe on the board is the primary input; the D-pad is the fallback.
  (function () {
    var sx = 0, sy = 0, tracking = false;
    var THRESHOLD = 22;

    boardWrap.addEventListener("pointerdown", function (ev) {
      // The card is anchored over the controls, so tapping the field is how
      // you put it away and get Undo, Reset and the level pips back.
      if (!bubble.hidden) { hideBubble(); return; }
      tracking = true;
      sx = ev.clientX;
      sy = ev.clientY;
    });

    boardWrap.addEventListener("pointermove", function (ev) {
      if (!tracking) return;
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < THRESHOLD) return;
      tracking = false;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
    });

    boardWrap.addEventListener("pointerup", function () { tracking = false; });
    boardWrap.addEventListener("pointercancel", function () { tracking = false; });
  })();

  // ---- Boot -------------------------------------------------------------
  LEVELS.forEach(function (lvl, i) {
    var b = document.createElement("button");
    b.className = "pip";
    b.type = "button";
    b.textContent = i + 1;
    b.setAttribute("aria-label", "Level " + (i + 1) + ": " + lvl.name);
    b.addEventListener("click", function () { goto(i); });
    pips.appendChild(b);
  });

  // Observe the shell, not the wrapper: the wrapper is what flex hands us
  // after everything else is laid out, and watching what you size is how you
  // get a resize loop.
  if (window.ResizeObserver) {
    new ResizeObserver(sizeBoard).observe(app);
  } else {
    window.addEventListener("resize", sizeBoard);
  }
  window.addEventListener("orientationchange", function () { setTimeout(sizeBoard, 120); });

  buildLevel(0);
</script>

</body>
</html>
